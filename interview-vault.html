["How do character sets and collations create bugs?","They control encoding, comparison, sorting, and uniqueness. Use utf8mb4 and choose case or accent sensitivity intentionally.","Two visually identical usernames collided after a collation change, requiring normalization policy before migration."],
["What causes metadata lock incidents?","DDL waits for transactions holding table metadata, while later queries queue behind the waiting DDL. Find and end the blocker rather than killing random queries.","An idle transaction blocked ALTER TABLE and then hundreds of application reads accumulated behind it."],
["How do you tune the InnoDB buffer pool?","Size it for the active dataset while leaving memory for connections and the OS; observe hit rate, eviction, dirty pages, and checkpoint pressure.","Increasing the pool helped until connection buffers pushed the host into swap, making overall latency worse."],
["What is the change buffer?","InnoDB can defer secondary-index updates for pages not in memory, reducing random I/O, but later merges consume resources.","A write-heavy import finished quickly but caused a delayed merge load that capacity planning had to include."],
["How should AUTO_INCREMENT be used in distributed writes?","Single-primary use is simple; multi-writer systems need offset schemes or application-generated IDs, each with ordering and fragmentation trade-offs.","Regional writers used time-sortable IDs rather than coordinating one global auto-increment sequence."],
["How do you design backups for MySQL?","Combine physical full backups, binary logs for point-in-time recovery, encryption, off-host storage, and routine restore tests.","A restore drill found missing binlogs before an incident, when the gap was still fixable."],
["When is partition pruning effective?","The predicate must constrain the partition expression in a form the optimizer recognizes. Every unique key must include partition columns under MySQL rules.","Date predicates pruned monthly partitions; wrapping the date column in a function defeated pruning."],
["What is semi-synchronous replication?","The primary waits until at least one replica acknowledges receiving the transaction, reducing loss windows while not guaranteeing replica apply.","Payments accepted slightly higher commit latency to reduce failover data-loss risk."],
["How do you diagnose lock waits?","Use performance_schema and sys views to identify waiting and blocking transactions, SQL, age, and locked objects; then fix ordering or indexes.","A missing index made an update lock thousands of rows and block unrelated requests."],
["What is ProxySQL useful for?","It provides connection multiplexing, routing, query rules, failover integration, and observability between applications and MySQL.","Read-only analytics were routed to replicas while transaction traffic remained on the writer."],
["When should MySQL not be the choice?","Avoid choosing it by habit when requirements depend heavily on advanced analytical SQL, specialized extensions, or strict cross-region consistency it does not provide alone.","A geospatial analytics product selected PostgreSQL/PostGIS rather than recreating spatial capabilities in application code."]
].forEach(x=>qaPlus("MY",...x));

[
["How does PostgreSQL MVCC differ operationally from in-place updates?","Updates create new tuple versions; VACUUM later reclaims dead tuples. Long snapshots prevent cleanup and can cause bloat.","An idle transaction held a snapshot for hours and stopped vacuum from reclaiming a high-churn queue table."],
["What is autovacuum and how do you tune it?","Autovacuum prevents transaction-ID wraparound, updates visibility information, and removes dead tuples. Tune scale factors per large or high-churn table rather than disabling it.","A 500-million-row table needed a low table-specific scale factor because the default waited for too many dead rows."],
["What is HOT update?","A heap-only tuple update avoids new index entries when indexed columns do not change and page space exists. Fillfactor can preserve that space.","Lowering fillfactor on a frequently updated status table increased HOT updates and reduced index bloat."],
["How do JSONB GIN indexes work?","GIN indexes values or paths for containment and existence queries. Choose jsonb_ops for flexibility or jsonb_path_ops for smaller containment-focused indexes.","A product attribute search used GIN while frequently sorted price remained a normal typed column."],
["When do BRIN indexes beat B-tree?","BRIN stores summaries per block range, making it tiny and effective for huge physically correlated tables such as append-only timestamps.","A multi-terabyte event table used BRIN on occurred_at and avoided a massive B-tree."],
["What does CREATE INDEX CONCURRENTLY trade off?","It allows writes during index construction but performs multiple scans, takes longer, and can leave an invalid index after failure.","A production index was built concurrently, monitored for validity, then adopted by the query plan."],
["How does transaction ID wraparound become dangerous?","Old transaction IDs can appear new after wraparound unless tuples are frozen. PostgreSQL forces protective vacuum and can stop writes to prevent corruption.","Monitoring age(datfrozenxid) prevented an emergency outage on a database with autovacuum-starved tables."],
["What is logical replication useful for?","It replicates selected tables and row changes across versions or topologies, supporting migrations and read models. DDL and sequences need separate handling.","A major-version upgrade used logical replication for low-downtime cutover and validation."],
["How do advisory locks help?","They provide application-defined session or transaction locks without locking a row. Define stable keys and always release session locks.","Only one scheduler instance processed a billing period by taking a transaction-scoped advisory lock."],
["What is row-level security?","RLS applies database-enforced policies per row and role. Set tenant context safely, test bypass roles, and retain application authorization.","A multi-tenant service added RLS as defense in depth against a missing tenant predicate."],
["How do INCLUDE indexes help?","Included columns cover queries without participating in tree ordering, keeping search keys focused while enabling index-only scans.","An index on customer_id included status and total for a summary endpoint."],
["What are extended statistics?","They capture dependencies, distinct combinations, or most-common combinations across columns when independent estimates are wrong.","Country and postal_code correlation stopped the optimizer from underestimating a regional query."],
["What causes index-only scans to still hit the heap?","PostgreSQL checks the visibility map; pages not marked all-visible require heap visits. Vacuum progress and churn determine effectiveness.","A read-mostly table achieved true index-only scans after vacuum marked stable pages visible."],
["How do you use SKIP LOCKED safely?","Workers select and lock available jobs while skipping those already claimed. Ensure retry, lease recovery, and fair ordering.","Ten workers consumed a database queue concurrently without blocking one another."],
["What is table bloat and how do you repair it?","Dead tuples and unused page space enlarge heap and indexes. Fix vacuum or transaction causes first, then use reindex, pg_repack, or controlled rewrite.","Repacking without fixing a long-running transaction only made the bloat return."],
["When should work_mem be changed?","It applies per sort or hash node, potentially many times per query and connection. Tune locally for a known operation rather than globally by wishful arithmetic.","A reporting transaction used SET LOCAL work_mem while OLTP sessions retained a conservative default."],
["How should connection limits be managed?","PostgreSQL uses a process per connection; excessive connections consume memory and increase contention. Pool and bound them.","PgBouncer transaction pooling let thousands of application requests share fewer than 100 backends."],
["What is synchronous_commit?","It controls how long commit waits for WAL durability or synchronous replicas. Relax it only where small recent loss is acceptable.","Audit writes kept full durability while rebuildable analytics counters used asynchronous commit."],
["How do exclusion constraints differ from unique constraints?","They prevent overlaps or other operator-defined conflicts, not just equality duplicates.","A room-booking table used an exclusion constraint on room and time range to prevent overlapping reservations."],
["When should PostgreSQL extensions be avoided?","Avoid an extension when managed-service support, upgrade cadence, portability, or operational ownership is unclear. Capability is not free.","A team chose built-in full-text search over an unsupported extension required by no proven workload."]
].forEach(x=>qaPlus("PG",...x));

[
["How do you design a multi-account AWS organization?","Separate production, non-production, security, logging, and shared services; apply SCP guardrails and centralize audit logs. Accounts are stronger boundaries than VPCs.","A compromised development role could not access production because workloads and KMS keys lived in separate accounts."],
["When should Lambda not be used?","Avoid Lambda for sustained high CPU, very long execution, specialized runtimes, predictable always-on load, or strict low-latency cold-start requirements.","A continuous video encoder moved to ECS because Lambda duration and ephemeral-storage limits fought the workload."],
["How do you choose ECS, EKS, or Lambda?","Choose Lambda for event-driven functions, ECS for container orchestration with low control-plane burden, and EKS when Kubernetes capabilities and skills are real requirements.","A small platform standardized APIs on ECS Fargate and reserved EKS for an acquired Kubernetes-native product."],
["How does S3 consistency affect design today?","S3 provides strong read-after-write and list consistency, but clients, CDNs, and application caches can still be stale. Object updates are not multi-object transactions.","An upload became immediately listable, while CloudFront required versioned keys to avoid cached old content."],
["What is the difference between SQS standard and FIFO?","Standard offers high throughput with at-least-once delivery and best-effort order; FIFO provides ordered message groups and deduplication with throughput constraints.","Payments used FIFO per account; independent email notifications used standard queues with idempotent consumers."],
["How do visibility timeouts work?","A received SQS message becomes temporarily hidden. Set or extend the timeout beyond processing time; delete only after success.","A worker heartbeat extended visibility for a large export, preventing another worker from duplicating it."],
["What is a good DynamoDB partition key?","It distributes traffic and supports access patterns. Avoid hot low-cardinality values; add calculated shards when one logical key is too hot.","Telemetry writes spread a large tenant across hourly hash suffixes and queried those shards in parallel."],
["How do DynamoDB conditional writes support concurrency?","Condition expressions make a write succeed only when the expected version or state matches, enabling optimistic locking and idempotency.","A seat reservation changed AVAILABLE to HELD only if the current state still matched."],
["How should KMS envelope encryption be understood?","KMS protects a data key; the service encrypts bulk data locally with that key and stores the encrypted data key beside ciphertext.","An application called KMS for key operations, not for every megabyte of file content."],
["What is an IAM permissions boundary?","It caps the maximum permissions an identity policy may grant. It does not grant access by itself.","A platform team let developers create roles only within a boundary that prohibited organization and billing APIs."],
["How do Route 53 routing policies differ?","Use simple, weighted, latency, failover, geolocation, or multi-value routing according to traffic goals. DNS caching limits instant failover.","A weighted record shifted five percent to a new region before a full rollout."],
["How do ALB and NLB differ?","ALB understands HTTP routing and headers; NLB provides high-performance layer-4 TCP/UDP and preserves source IP. Choose by protocol, not marketing.","Path-based microservice routing used ALB; a high-throughput TLS passthrough service used NLB."],
["What are VPC endpoints for?","Gateway and interface endpoints reach supported AWS services privately without NAT or internet paths, reducing exposure and often cost.","Private workloads accessed S3 through a gateway endpoint and removed large NAT data-processing charges."],
["How do you achieve cross-region disaster recovery?","Choose backup/restore, pilot light, warm standby, or active-active from measured RTO and RPO; replicate data and rehearse failover.","A payments platform used warm standby because five-minute RTO justified cost but active-active complexity did not."],
["What is CloudFront origin access control?","It lets CloudFront sign requests to private S3 origins so users cannot bypass distribution controls.","A media bucket blocked public access and accepted reads only from the named distribution."],
["How should secrets be managed on AWS?","Use Secrets Manager or Parameter Store with KMS, workload roles, rotation, caching, and audit. Never bake secrets into images or user data.","A database credential rotated automatically while ECS tasks retrieved it through task-role authorization."],
["How do you control AWS cost architecturally?","Tag ownership, define budgets, right-size, select purchase models, reduce cross-AZ and NAT traffic, expire storage, and measure unit cost.","S3 lifecycle and VPC endpoints saved more than instance tuning for a document platform."],
["What does well-architected observability include?","Collect structured logs, metrics, traces, business signals, deployment markers, and actionable alarms with runbooks.","Checkout alerted on successful-orders-per-minute and latency, not raw CPU alone."],
["How do Step Functions improve workflows?","They make state, retries, timeouts, compensation, and execution history explicit. Avoid them for very high-frequency trivial chains where transition cost dominates.","An onboarding workflow waited for manual approval and resumed days later without a running process.","sequenceDiagram\nautonumber\nparticipant A as API\nparticipant S as Step Functions\nparticipant L as Validation Lambda\nparticipant H as Human approval\nparticipant W as Provisioning worker\nA->>S: Start onboarding\nS->>L: Validate request\nL-->>S: Valid\nS->>H: Request approval token\nH-->>S: Approve callback\nS->>W: Provision resources\nW-->>S: Complete\nS-->>A: Execution succeeded"],
["How do you deploy safely with CodeDeploy or weighted routing?","Publish immutable artifacts, run health checks, shift traffic gradually, monitor business and technical alarms, and automate rollback.","A canary received ten percent traffic and rolled back when payment authorization rate dropped."]
].forEach(x=>qaPlus("AWS",...x));

[
["How does the Strategy pattern differ from a switch?","Strategy encapsulates interchangeable algorithms behind a stable contract. A switch is fine for small closed choices; Strategy earns its cost when behavior varies independently or is injected.","Shipping calculators for carriers were registered by key and tested independently."],
["When is the Decorator pattern preferable to inheritance?","Decorator composes cross-cutting behavior around an interface at runtime without creating subclass combinations.","Caching, retry, metrics, and authorization wrapped a pricing client in a declared order."],
["What problem does the Mediator pattern solve and create?","Mediator decouples senders from handlers and centralizes pipelines, but can hide control flow and become a service locator if overused.","Commands used MediatR behaviors for validation; simple in-process method calls stayed direct."],
["How do Adapter and Facade differ?","Adapter changes one interface into another expected contract; Facade provides a simpler entry point over a complex subsystem.","A SOAP bureau adapter implemented a domain port, while a checkout facade coordinated inventory and payment APIs."],
["What is the Specification pattern trade-off?","It names and composes business predicates, but generic query specifications can become a leaky ORM language.","Eligibility rules were domain specifications; arbitrary includes and order strings were not exposed to callers."],
["How does Chain of Responsibility work?","Handlers process or pass a request along a chain. Make ordering, termination, and error semantics explicit.","Fraud checks ran cheap rules before expensive external scoring and stopped on a decisive rejection."],
["When should you use the State pattern?","Use it when behavior changes by lifecycle state and scattered conditionals are growing. Transitions belong to state or aggregate rules.","A subscription handled pause, resume, renew, and cancel differently in Trial, Active, PastDue, and Ended states."],
["What is a Null Object and when is it dangerous?","It supplies safe no-op behavior instead of repeated null checks. It is dangerous when absence should be visible or audited.","A no-op metrics sink simplified local tests; a no-op payment gateway would have hidden a critical configuration failure."],
["How does the Template Method pattern compare with Strategy?","Template Method fixes an algorithm skeleton through inheritance; Strategy delegates variable steps through composition. Prefer Strategy when combinations or runtime selection matter.","A framework base job used Template Method, while retry calculation was injected as Strategy."],
["What is the Observer pattern in distributed systems?","Observers receive notifications from a subject; distributed versions require durable brokers, retries, ordering policy, and idempotency.","OrderPlaced subscribers independently handled email and inventory through queues."],
["How does the Command pattern support undo and queues?","A command captures intent and parameters as an object, enabling logging, scheduling, retries, or inverse operations.","A document editor stored RenameSection commands and their previous values for undo."],
["What is the Memento pattern?","Memento captures restorable state without exposing internals. Large snapshots may require diffs or event histories.","A workflow designer saved versioned snapshots before destructive bulk edits."],
["How should Factory Method and Abstract Factory be distinguished?","Factory Method delegates creation of one product; Abstract Factory creates a compatible family of products.","A regional payment factory created matching tax, currency, and settlement adapters."],
["What is dependency injection versus Service Locator?","DI makes dependencies explicit at construction; Service Locator hides resolution inside methods and weakens tests and reasoning.","A handler constructor showed its gateway requirement instead of calling a global container."],
["When does Repository become an anti-pattern?","A generic CRUD repository can erase useful database capabilities and duplicate EF Core. Repositories are useful around aggregate or domain-specific persistence contracts.","Commands used an Order repository while reporting queries projected directly through EF Core."],
["How does Unit of Work relate to EF Core?","DbContext already tracks changes and commits them together; wrapping it mechanically usually adds no value. Add an application transaction boundary only where semantics require it.","A command handler called SaveChanges once rather than layering custom Begin and Commit abstractions around every repository."],
["What is the Circuit Breaker pattern?","It stops calls after repeated failures, probes recovery after a delay, and prevents cascading resource exhaustion. It complements, not replaces, timeouts.","A failing address provider was short-circuited so request threads did not pile up."],
["How does Bulkhead isolation work?","Separate concurrency pools or queues prevent one dependency or workload from consuming all shared capacity.","Slow report generation had its own semaphore and could not starve checkout requests."],
["What is the Saga pattern?","A saga coordinates local transactions across services with events or an orchestrator and compensates completed steps after failure.","Travel booking released the hotel when flight confirmation failed; compensation was a business action, not database rollback."],
["How do you decide whether a pattern is justified?","Name the concrete force it resolves, compare the simpler design, and define a removal or revisit signal. Familiar vocabulary is not sufficient.","A team kept a switch for three stable export types and deferred a plugin strategy until external extensions became real."]
].forEach(x=>qaPlus("DP",...x));

[
["How do Clean Architecture boundaries map to projects?","Domain contains business rules, Application owns use cases and ports, Infrastructure implements adapters, and API or UI handles delivery. References point inward.","A domain test calculated pricing without EF Core, ASP.NET Core, or network dependencies."],
["What is a modular monolith?","It deploys as one unit while enforcing explicit module boundaries, private data ownership, and stable internal contracts.","Orders and Billing shared a process but could not access each other's EF entities or tables directly."],
["When should a monolith be split?","Split when independently changing or scaling bounded contexts creates measured pain and the organization can own distributed operations. Do not split by technical layer.","A video transcoding workload became a service because its scaling and deployment differed radically from account management."],
["What is vertical slice architecture?","Organize code around a use case from endpoint through behavior and persistence rather than horizontal technical folders.","The CancelOrder slice contained request, validation, handler, mapping, and tests, reducing cross-feature coupling."],
["How do bounded contexts guide service boundaries?","A bounded context owns a language and model. Boundaries appear where definitions, invariants, teams, or change cadence differ.","Customer in Support meant a ticket requester; in Billing it meant a legal payer, so models were not shared."],
["What is an anti-corruption layer?","It translates an external or legacy model into the local domain language, preventing foreign semantics from spreading.","A legacy ERP status code was mapped to explicit fulfillment states at one adapter boundary."],
["How do architecture fitness functions work?","They automatically test desired architectural characteristics such as dependency direction, naming, coupling, or latency budgets.","A CI test failed if Domain referenced Infrastructure or if an API endpoint bypassed authorization metadata."],
["What belongs in an ADR?","Record context, decision, alternatives, consequences, validation, owners, date, and revisit trigger. Keep it concise and immutable except for status.","An ADR explained why SQLite was chosen and named multi-user deployment as the PostgreSQL revisit trigger."],
["What is hexagonal architecture?","The application core exposes inbound and outbound ports; adapters translate HTTP, messaging, databases, and vendors into those ports.","The same use case ran from an HTTP endpoint and a queue consumer without depending on either transport."],
["How should cross-cutting concerns be implemented?","Place each concern at the narrowest reliable boundary: middleware for transport, pipeline behaviors for use cases, decorators for outbound ports, and database constraints for data invariants.","Validation used a command behavior while correlation IDs used HTTP middleware."],
["What is architecture runway?","It is enough technical foundation for near-term features without speculative platform construction. Build it incrementally against known roadmap risks.","A team added tenant isolation before enterprise onboarding but deferred multi-region writes until an actual requirement."],
["How do you manage shared libraries across services?","Share stable technical primitives sparingly; avoid shared domain models that force lockstep releases. Version contracts and prefer generated clients.","Services shared tracing setup but owned separate Order representations."],
["What is evolutionary architecture?","It supports incremental change through modularity, automated fitness functions, observability, and reversible decisions.","A monolith extracted one event-driven workload while contracts and measurements verified each step."],
["How do data ownership and service ownership relate?","A service owns writes and invariants for its data; other services use APIs, events, or replicated read models rather than direct table updates.","Analytics consumed events instead of joining production service databases."],
["When is CQRS inappropriate?","Avoid it when reads and writes share a simple model, consistency must be immediate, and separate projections add more operational cost than value.","A small administrative CRUD module used one EF model while high-volume order search used CQRS."],
["How do you prevent architecture diagrams from becoming fiction?","Generate or verify what can be automated, link diagrams to owners and ADRs, review them in feature changes, and show deployment reality.","A dependency diagram generated in CI exposed a forbidden module reference immediately."],
["What is the role of a composition root?","It is the one place that assembles concrete implementations and configuration for application ports. Business code should not resolve services dynamically.","Program.cs wired payment adapters; the domain knew only IPaymentGateway."],
["How do you design for testability without test-driven abstractions everywhere?","Keep pure decisions separate from I/O, isolate real boundaries, inject nondeterminism, and avoid interfaces for classes with no seam or variation.","An IClock made expiry deterministic, while a pure price calculator needed no interface."],
["How does Conway's Law affect architecture?","Communication structures shape system boundaries. Align team ownership with bounded contexts or expect coordination-heavy distributed monoliths.","Two teams jointly owning every service produced synchronized releases despite microservice deployment."],
["What is a paved road platform?","It provides supported defaults for deployment, telemetry, security, and templates while allowing justified escape hatches.","A service template shipped health checks and tracing automatically, cutting setup without forcing one database."]
].forEach(x=>qaPlus("ARC",...x));

[
["How do you start a system design interview?","Clarify users, core journeys, scale, latency, consistency, availability, security, and exclusions before drawing components. State assumptions numerically.","For a notification system, the candidate first separated transactional alerts from bulk campaigns."],
["How do you estimate capacity quickly?","Convert daily traffic to average and peak requests per second, estimate payloads, retention, replication, and growth, then identify dominant resources.","One billion 1 KB events per day implied roughly 1 TB raw daily before indexes and replication."],
["What is consistent hashing?","It maps nodes and keys onto a ring so membership changes move only a fraction of keys. Virtual nodes improve balance.","A distributed cache added a node without remapping nearly every cached key."],
["How do Bloom filters help storage systems?","They probabilistically prove absence with no false negatives but possible false positives, avoiding expensive reads for missing keys.","An LSM store skipped disk tables whose Bloom filters showed a key could not exist."],
["What is quorum consistency?","With N replicas, read R and write W quorums overlap when R plus W exceeds N, improving latest-value probability while trading latency and availability.","A critical profile store used N=3, W=2, R=2; a metrics store chose weaker reads."],
["How do leader-based and leaderless replication differ?","Leader-based systems serialize writes through a primary; leaderless systems accept writes at replicas and reconcile versions. Each shifts availability and conflict complexity.","A catalog tolerated leaderless eventual updates; financial balances used ordered leader writes."],
["What is cache stampede and how is it prevented?","Many requests recompute one expired value simultaneously. Use request coalescing, jittered TTLs, stale-while-revalidate, and bounded refresh.","One worker refreshed a popular price while others received slightly stale data."],
["How do you choose a message partition key?","Choose a key that preserves required ordering while distributing load. Hot entities may need redesign because one key maps to one ordered lane.","Orders partitioned by order ID; using country created severe hot partitions."],
["What is backpressure in distributed systems?","Consumers signal or enforce limited capacity so producers slow, queue durably, shed load, or degrade instead of exhausting memory.","An ingestion API returned 429 with Retry-After when its bounded durable queue reached capacity."],
["How do you design an idempotent consumer?","Use a stable event ID, atomically record processing with effects, make writes conditional or naturally idempotent, and handle duplicate delivery.","A shipment consumer inserted event ID and shipment transition in one database transaction."],
["What are RPO and RTO?","RPO is acceptable data loss measured in time; RTO is acceptable restoration time. They determine replication, backup frequency, and cost.","A payroll system required zero committed-data loss and 15-minute recovery, unlike a rebuildable recommendation cache."],
["How do you design a rate limiter?","Define identity, algorithm, scope, distributed state, burst behavior, failure mode, headers, and fairness. Token bucket usually supports controlled bursts.","An API gateway limited each tenant globally through Redis-backed token buckets."],
["How does a CDN improve more than latency?","It offloads origins, absorbs traffic spikes, terminates TLS, applies edge security, and caches immutable content. Invalidation and personalized content remain constraints.","Versioned assets cached for a year while HTML used short TTL and stale-if-error."],
["What is load shedding?","Reject low-priority or excess work before saturation so critical operations remain healthy. Make degradation explicit and observable.","Recommendations were disabled when latency rose, preserving checkout capacity."],
["How do you design unique ID generation?","Compare database sequences, UUIDs, time-sortable IDs, and coordinated generators for order, locality, privacy, and collision requirements.","Time-sortable IDs reduced B-tree fragmentation without exposing exact database row counts."],
["What is the hot-key problem?","One key or partition receives disproportionate traffic and defeats horizontal scaling. Cache, replicate, shard the logical key, or change access patterns.","A celebrity profile was replicated in edge cache instead of hammering one database partition."],
["How do you handle clock assumptions?","Use UTC for timestamps, monotonic clocks for elapsed time, tolerate skew, and avoid using wall-clock order as distributed truth.","Lease expiry included a safety margin and fencing token rather than trusting synchronized clocks alone."],
["What is a fencing token?","Each lock or lease grant gets an increasing token; downstream storage rejects older tokens, preventing paused former owners from writing.","A delayed worker resumed after lease loss but its stale token was rejected by storage."],
["How do you design multi-region writes?","First ask whether writes truly need to be active-active. Define conflict ownership, data locality, consistency, routing, and failover before selecting technology.","User preferences merged by field across regions; account balance writes stayed single-home."],
["How do you verify a design after drawing it?","Walk normal flow, overload, dependency failure, retry duplication, regional failure, security abuse, operability, and cost against requirements.","A review discovered that retries could double-submit payments before implementation began.","sequenceDiagram\nautonumber\nparticipant C as Client\nparticipant G as Gateway\nparticipant S as Service\nparticipant Q as Queue\nparticipant W as Worker\nparticipant D as Database\nC->>G: Request with idempotency key\nG->>S: Authenticated request\nS->>D: Reserve key and state\nS->>Q: Outbox publishes work\nS-->>C: 202 operationId\nQ-->>W: At-least-once delivery\nW->>D: Conditional idempotent update\nW-->>Q: Ack"]
].forEach(x=>qaPlus("SYS",...x));

[
["How does SRP apply to methods as well as classes?","A unit should have one cohesive reason to change, not merely one method. Separate policy decisions from formatting, persistence, and transport.","Tax calculation remained pure while invoice rendering and storage changed independently."],
["How do you identify a real OCP extension point?","Look for repeated variation driven by external policy or product choices. Stabilize a small contract only after the axis of change is understood.","New discount rules arrived monthly, justifying composable policies; one stable calculation stayed inline."],
["What is behavioral subtyping under LSP?","Subtypes must preserve preconditions, postconditions, invariants, and observable expectations—not just compile against the same members.","A read-only collection subtype throwing on Add violated the mutable collection contract."],
["How do role interfaces improve ISP?","Define interfaces around what each consumer needs rather than around a large implementation's full capability.","A dashboard depended on IOrderReader and could not accidentally invoke cancellation commands."],
["What does DIP say about policy and detail?","High-level policy and low-level detail both depend on abstractions owned near the policy. Runtime DI is only the assembly mechanism.","The application defined IExchangeRates; an HTTP adapter implemented it."],
["Can a class have multiple responsibilities and still be cohesive?","Yes, related operations serving one reason to change can belong together. Splitting every method creates navigation and orchestration noise.","A Money value owned arithmetic and currency validation because both changed with the same domain concept."],
["How does OCP interact with feature flags?","Flags can select implementations without editing core flow, but permanent nested flags become another giant conditional. Remove flags after rollout.","A new tax strategy ran behind a temporary flag and the old path was deleted after validation."],
["How do contract tests protect LSP?","Run the same behavioral suite against every implementation of an interface, including error and cancellation semantics.","Every blob store adapter passed tests for overwrite, missing objects, cancellation, and metadata."],
["What is an ISP smell in generated clients?","Consumers mocking or configuring dozens of unused methods indicate an interface shaped around a provider rather than the consumer.","A billing use case wrapped a huge generated ERP client behind a three-method application port."],
["How can DIP be over-applied?","Interfaces around every pure class add ceremony without isolating I/O, variation, or nondeterminism. Depend directly on stable concrete value services.","A deterministic parser stayed concrete while filesystem and clock remained injected boundaries."],
["How do SOLID principles affect module boundaries?","SRP groups cohesive change, DIP points dependencies inward, ISP narrows contracts, OCP permits additions, and LSP protects substitutable adapters.","A module exposed commands and events instead of its database entities."],
["What is temporal coupling and which principle exposes it?","Temporal coupling requires calls in a hidden order. It often signals poor encapsulation and SRP; model valid transitions explicitly.","Replacing Initialize then Configure then Start with a validated factory removed invalid intermediate states."],
["How does Tell, Don't Ask support SRP?","Move decisions beside the state and invariants they require rather than extracting data for distant procedural logic.","Order.Cancel decided eligibility internally instead of a service inspecting five properties."],
["When does composition violate SRP?","A coordinator can become a god object even when every dependency is injected. Delegation does not make unrelated workflow ownership cohesive.","A checkout orchestrator was split when it accumulated catalog administration and reporting behavior."],
["How do SOLID and performance trade off?","Abstractions have allocation, dispatch, query, and cognitive costs; measure hot paths and preserve clear boundaries without dogma.","A serializer hot loop used direct structs while service boundaries retained interfaces."],
["What does a good interface name communicate?","Name the capability or role the consumer needs, not an implementation prefix or vague manager noun.","IClock and IOrderReader conveyed contracts better than IDateTimeManager and IDataService."],
["How should constructors enforce invariants?","Require dependencies and valid initial state at construction; use factories when creation can fail or requires asynchronous I/O.","An Order.Create result rejected empty lines so no invalid Order instance escaped."],
["How does YAGNI constrain OCP?","Design for observed change, not every imaginable future. The simplest code is easier to extend once the real axis appears.","A team duplicated two small exporters before extracting the shared pattern after the third."],
["How do you review a SOLID refactor?","Ask what coupling or change cost was reduced, compare call paths and tests, and reject abstractions with no current benefit.","A proposed six-interface pipeline was replaced by one pure function and one gateway boundary."],
["What is the relationship between SOLID and functional programming?","Pure functions and immutable data naturally improve SRP, substitution, and dependency control; SOLID remains useful around stateful object boundaries.","Pricing rules were pure functions composed as data, while adapters followed DIP."]
].forEach(x=>qaPlus("SOL",...x));

[
["What changed conceptually with React Server Components?","Server Components render on the server and do not ship component code to the browser; Client Components own interactivity. The boundary controls serialization and bundle size.","A product page fetched catalog data in a Server Component while the cart button remained client-side."],
["How do Suspense and transitions improve perceived performance?","Suspense defines loading boundaries; transitions mark non-urgent updates so current UI remains responsive. They do not replace a data strategy by themselves.","Search results updated in a transition while the input stayed immediately responsive."],
["What is hydration and why do mismatches occur?","Hydration attaches behavior to server-rendered HTML. Differences from time, randomness, browser-only state, or invalid markup force warnings or client rerender.","A localized timestamp rendered differently on server and browser until formatting moved behind a stable boundary."],
["How do error boundaries work?","They catch render and lifecycle errors below them and render fallback UI; they do not catch event-handler or arbitrary asynchronous errors.","Each dashboard widget had a boundary so one failed chart did not blank the entire page."],
["Why use useReducer?","It centralizes related state transitions and makes event-driven updates explicit when multiple values change together.","A checkout form modeled address, delivery, and payment transitions in one reducer instead of scattered setters."],
["What does useSyncExternalStore solve?","It provides consistent subscription and snapshot semantics for external stores across concurrent rendering and server hydration.","A custom browser store avoided tearing by exposing stable getSnapshot and subscribe functions."],
["How should accessibility be tested in React?","Use semantic HTML and keyboard behavior first, then automated axe checks and manual screen-reader, focus, zoom, and contrast testing.","A modal passed automated checks but manual testing found focus escaped behind it."],
["How do portals affect event handling?","A portal changes DOM placement but remains in the React tree, so context and React event bubbling follow component ancestry.","A dialog rendered at document body but its click still bubbled to the owning React component."],
["What is stale closure behavior in hooks?","A callback captures values from its render. Missing dependencies or delayed callbacks may read obsolete state; use honest dependencies or functional updates.","An interval incremented only once until setCount received a functional updater."],
["How do you design optimistic UI safely?","Update the cache immediately, preserve rollback state, reconcile with server truth, prevent duplicate submissions, and communicate pending status.","A comment appeared instantly, then rolled back with an accessible error when moderation rejected it."],
["When is state colocation important?","Keep state at the lowest common owner that needs it. Over-lifting causes broad rerenders and tight coupling; under-lifting duplicates truth.","Expanding one table row stayed inside the row rather than entering the global store."],
["How do you test React behavior rather than implementation?","Interact through roles and labels, observe user-visible outcomes, mock network boundaries, and avoid asserting internal state or hook calls.","A login test typed into labeled fields and waited for navigation instead of inspecting component state."],
["How do React keys help outside lists?","A changed key intentionally resets a component subtree and its local state.","Changing customer ID keyed the edit form and prevented previous customer values leaking into the next form."],
["What is tearing in concurrent UI?","Tearing occurs when components observe different snapshots of shared mutable state during one render. Compatible external-store APIs prevent it.","A home-grown mutable store showed mismatched totals until migrated to selector subscriptions."],
["How do you secure rendered HTML?","React escapes text by default. Avoid dangerouslySetInnerHTML; when unavoidable, sanitize with a maintained allowlist and block scriptable URLs.","Markdown previews used a sanitizer and disabled raw HTML."],
["How should authentication state be represented?","Model loading, authenticated, and anonymous explicitly; keep tokens out of general UI state where possible and rely on secure cookies or a protected native store.","The router waited for session resolution instead of briefly flashing protected content."],
["What causes memory leaks in React applications?","Unremoved listeners, timers, subscriptions, retained caches, and unfinished async work keep references alive. Cleanup effects and profile heap retention.","A chart component registered a resize listener on every mount and degraded a long-lived dashboard."],
["How do you choose component boundaries?","Split around cohesive behavior, reuse, independent loading/error states, and performance boundaries—not arbitrary line counts.","A payment form isolated provider-specific behavior while keeping tiny presentation fragments inline."],
["What is the React Compiler trade-off?","It can automate memoization based on static analysis, reducing manual useMemo noise, but requires compatible code and does not fix poor state architecture.","A measured migration removed hand-written callbacks while profiler tests guarded regressions."],
["How do you handle real-time updates with React Query?","Treat WebSocket events as invalidation or precise cache updates, preserve query keys, handle reconnect gaps, and periodically reconcile.","Order events patched visible rows and invalidated the list after reconnect to recover missed messages.","sequenceDiagram\nautonumber\nparticipant S as Server\nparticipant W as WebSocket\nparticipant U as React UI\nparticipant Q as Query cache\nS-->>W: OrderUpdated event\nW-->>U: Event with order id and version\nU->>Q: Patch matching cached order\nQ-->>U: Rerender subscribers\nW--xU: Connection lost\nU->>W: Reconnect with last version\nU->>Q: Invalidate order queries\nQ-->>U: Reconciled server state"]
].forEach(x=>qaPlus("REA",...x));

/* ================= APP ================= */
const PAGE_SIZE = 5;
mermaid.initialize({ startOnLoad:false, theme:"neutral", securityLevel:"loose",
  themeVariables:{ fontFamily:"JetBrains Mono, monospace", fontSize:"13px" } });

/* assign IDs: API-01, API-02 ... */
const counters = {};
D.forEach(item => {
  counters[item.t] = (counters[item.t] || 0) + 1;
  item.id = item.t + "-" + String(counters[item.t]).padStart(2, "0");
});
document.getElementById("question-total").textContent = String(D.length);

const state = { topic: TOPICS[0].k, page: 1, query: "" };
const $ = sel => document.querySelector(sel);
const tabsEl = $("#tabs"), listEl = $("#list"), pagerEl = $("#pager");

function itemsFor() {
  const qy = state.query.trim().toLowerCase();
  if (qy) {
    return D.filter(x => (x.q + " " + x.a + " " + x.id).toLowerCase().includes(qy));
  }
  return D.filter(x => x.t === state.topic);
}

function renderTabs() {
  tabsEl.innerHTML = "";
  TOPICS.forEach(tp => {
    const b = document.createElement("button");
    b.className = "tab" + (tp.k === state.topic && !state.query ? " active" : "");
    b.setAttribute("role", "tab");
    b.innerHTML = `<span>${tp.label}</span><span class="cnt">${counters[tp.k]||0}</span>`;
    b.onclick = () => { state.topic = tp.k; state.page = 1; state.query = ""; $("#search").value = ""; render(); window.scrollTo({top:0}); };
    tabsEl.appendChild(b);
  });
}

  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  share:'<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="m8.7 10.7 6.6-3.4M8.7 13.3l6.6 3.4"/></svg>',
  print:'<svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'
};

function cardHtml(item, topicLabel) {
  return `
  <article class="card" id="${item.id}" data-id="${item.id}">
    <div class="card-top">
      <span class="qid">${item.id}</span>
      <h3 class="qtitle">${item.q}</h3>
    </div>
    <div class="card-body">
      ${item.a}
      ${item.m ? `<div class="diagram"><div class="diagram-label">Sequence diagram · steps autonumbered</div><pre class="mermaid">${item.m}</pre></div>` : ""}
    </div>
    <div class="card-actions">
      <button class="act" data-act="copy"  data-id="${item.id}">${ICONS.copy}Copy</button>
      <button class="act" data-act="share" data-id="${item.id}">${ICONS.share}Share</button>
      <button class="act" data-act="print" data-id="${item.id}">${ICONS.print}Print</button>
    </div>
  </article>`;
}

async function render() {
  renderTabs();
  const items = itemsFor();
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  if (state.page > pages) state.page = 1;
  const start = (state.page - 1) * PAGE_SIZE;
  const slice = items.slice(start, start + PAGE_SIZE);
  const label = state.query
    ? `Search: \u201C${state.query}\u201D`
    : TOPICS.find(t => t.k === state.topic).label;

  $("#topic-title").textContent = label;
  $("#topic-meta").textContent = items.length
    ? `${items.length} question${items.length === 1 ? "" : "s"} \u00B7 page ${state.page}/${pages} \u00B7 showing ${start + 1}\u2013${start + slice.length}`
    : "";

  listEl.innerHTML = slice.length
    ? slice.map(i => cardHtml(i)).join("")
    : `<div class="empty">No questions match. Try fewer or different keywords.</div>`;

  renderPager(pages);
  try { await mermaid.run({ nodes: listEl.querySelectorAll(".mermaid") }); } catch(e) { console.warn("mermaid:", e); }
}

function renderPager(pages) {
  pagerEl.innerHTML = "";
  if (pages <= 1) return;
  const mk = (txt, page, opts = {}) => {
    const b = document.createElement("button");
    b.textContent = txt;
    if (opts.cur) b.className = "cur";
    b.disabled = !!opts.disabled;
    b.onclick = () => { state.page = page; render(); $("#content").scrollIntoView?.({block:"start"}); };
    pagerEl.appendChild(b);
  };
  mk("\u2039 Prev", state.page - 1, { disabled: state.page === 1 });
  const win = [];
  for (let p = 1; p <= pages; p++)
    if (p === 1 || p === pages || Math.abs(p - state.page) <= 1) win.push(p);
  let last = 0;
  win.forEach(p => {
    if (p - last > 1) { const gap = document.createElement("span"); gap.className = "pinfo"; gap.textContent = "\u2026"; pagerEl.appendChild(gap); }
    mk(String(p), p, { cur: p === state.page });
    last = p;
  });
  mk("Next \u203A", state.page + 1, { disabled: state.page === pages });
}

/* ---------- actions ---------- */
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1800);
}

function plainText(item) {
  const tmp = document.createElement("div");
  tmp.innerHTML = item.a;
  tmp.querySelectorAll("pre").forEach(p => { p.textContent = "\n" + p.textContent + "\n"; });
  const topic = TOPICS.find(t => t.k === item.t).label;
  return `[${item.id}] ${topic}\n\nQ: ${item.q}\n\nA: ${tmp.textContent.replace(/\n{3,}/g,"\n\n").trim()}` +
         (item.m ? `\n\nSequence diagram (Mermaid):\n${item.m}` : "");
}

async function doCopy(item, btn) {
  try {
    await navigator.clipboard.writeText(plainText(item));
    toast("Copied Q&A to clipboard");
  } catch {
    toast("Copy failed \u2014 select and copy manually");
  }
  if (btn) { btn.classList.add("done"); setTimeout(() => btn.classList.remove("done"), 1200); }
}

async function doShare(item) {
  const url = location.origin + location.pathname + "#q=" + item.id;
  const payload = { title: item.id + " \u00B7 Interview Q&A", text: item.q, url };
  if (navigator.share) {
    try { await navigator.share(payload); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url + "\n\n" + item.q); toast("Link copied \u2014 paste anywhere"); }
  catch { toast("Sharing unavailable in this context"); }
}

function doPrint(item) {
  const card = document.getElementById(item.id);
  const pa = $("#print-area");
  const topic = TOPICS.find(t => t.k === item.t).label;
  pa.innerHTML = card ? card.outerHTML : cardHtml(item);
  pa.insertAdjacentHTML("beforeend",
    `<div class="print-foot">The Principal\u2019s Vault \u00B7 ${topic} \u00B7 ${item.id} \u00B7 printed ${new Date().toLocaleDateString()}</div>`);
  const finish = () => window.print();
  const nodes = pa.querySelectorAll(".mermaid:not([data-processed])");
  if (nodes.length) mermaid.run({ nodes }).then(finish).catch(finish); else finish();
}

listEl.addEventListener("click", e => {
  const btn = e.target.closest(".act");
  if (!btn) return;
  const item = D.find(x => x.id === btn.dataset.id);
  if (!item) return;
  ({ copy: () => doCopy(item, btn), share: () => doShare(item), print: () => doPrint(item) })[btn.dataset.act]();
});

/* ---------- search ---------- */
let deb;
$("#search").addEventListener("input", e => {
  clearTimeout(deb);
  deb = setTimeout(() => { state.query = e.target.value; state.page = 1; render(); }, 200);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#search")) { e.preventDefault(); $("#search").focus(); }
});

/* ---------- deep link: #q=API-04 ---------- */
async function openFromHash() {
  const m = location.hash.match(/#q=([A-Z]+-\d+)/);
  if (!m) return;
  const item = D.find(x => x.id === m[1]);
  if (!item) return;
  state.query = "";
  $("#search").value = "";
  state.topic = item.t;
  const idx = D.filter(x => x.t === item.t).findIndex(x => x.id === item.id);
  state.page = Math.floor(idx / PAGE_SIZE) + 1;
  await render();
  const el = document.getElementById(item.id);
  if (el) { el.scrollIntoView?.({ block: "start" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2500); }
}
window.addEventListener("hashchange", openFromHash);

render().then(openFromHash);
</script>
