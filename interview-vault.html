"<pre><code>// Domain port (what WE want):\npublic interface ICreditCheck {\n    Task&lt;CreditDecision&gt; AssessAsync(CustomerId id, Money amount, CancellationToken ct);\n}\n\n// Adapter over a 2009 SOAP service we cannot change:\npublic sealed class LegacyBureauAdapter(BureauSoapClient soap) : ICreditCheck {\n    public async Task&lt;CreditDecision&gt; AssessAsync(CustomerId id, Money amount, CancellationToken ct) {\n        var resp = await soap.RunCheckXmlAsync(new ChkReq {\n            CUST_REF = id.ToLegacyRef(), AMT_PENCE = amount.ToPence() });\n        return resp.Code switch {\n            \"A\" =&gt; CreditDecision.Approved,\n            \"R\" =&gt; CreditDecision.Referred(resp.ReasonTxt),\n            _   =&gt; CreditDecision.Declined\n        };\n    }\n}</code></pre>"+
"<p>All the ugliness (naming, pence, magic codes) is quarantined in one file. When the bureau was replaced with a REST vendor two years later, we wrote a second adapter and deleted the first — the domain and its tests never changed. This is DIP made concrete: ports owned by the domain, adapters at the edge.</p>"),
q("DP","Builder pattern — where does it genuinely help in modern C#?",
"<p>With object initialisers, records and <code>with</code>, classic builders are rarely needed for DTOs. They still earn their place when construction is <em>multi-step, validated, or fluent-by-design</em>:</p>"+
"<ul><li><strong>Test data builders</strong> — the highest-value use: readable tests that state only what matters.</li><li><strong>Framework configuration</strong> — <code>WebApplicationBuilder</code>, <code>ConfigurationBuilder</code>, <code>IHttpClientBuilder</code> are builders you use daily.</li><li><strong>Complex immutable domain objects</strong> with cross-field invariants checked once in <code>Build()</code>.</li></ul>"+
"<pre><code>var order = new OrderBuilder()          // defaults: 1 line, GBP, UK address\n    .ForCustomer(TestIds.VipCustomer)\n    .WithLine(sku: \"CANDLE-AMBER\", qty: 3)\n    .Discounted(10.Percent())\n    .Build();                            // validates invariants here\n\n// vs. the 14-argument constructor call repeated in 200 tests</code></pre>"+
"<p>When a builder is just setters with no invariants or defaults, prefer a record with init-only properties — less code, same clarity.</p>"),
q("DP","Circuit breaker — explain the states and wire it with Polly for a flaky downstream.",
"<p>Retries alone make outages worse: every caller hammering a dying service is a self-inflicted DDoS. A circuit breaker fails fast once failures cross a threshold, giving the downstream room to recover.</p>"+
"<ul><li><strong>Closed</strong>: normal; failures counted.</li><li><strong>Open</strong>: threshold crossed; calls fail immediately for the break duration.</li><li><strong>Half-open</strong>: after the break, a probe call decides — success closes, failure re-opens.</li></ul>"+
"<pre><code>services.AddHttpClient&lt;InventoryClient&gt;()\n  .AddResilienceHandler(\"inv\", b =&gt; {\n     b.AddTimeout(TimeSpan.FromSeconds(2));\n     b.AddRetry(new() { MaxRetryAttempts = 2, BackoffType = DelayBackoffType.Exponential, UseJitter = true });\n     b.AddCircuitBreaker(new() { FailureRatio = 0.5, MinimumThroughput = 20,\n                                 SamplingDuration = TimeSpan.FromSeconds(30),\n                                 BreakDuration = TimeSpan.FromSeconds(15) });\n  });</code></pre>"+
"<p>Pair the open state with a fallback (cached stock levels, &ldquo;availability unknown&rdquo; UI) — the breaker protects systems; the fallback protects users.</p>",
"sequenceDiagram\nautonumber\nparticipant App as Orders API\nparticipant CB as Circuit Breaker\nparticipant Inv as Inventory Service\nApp->>CB: GetStock(sku)\nCB->>Inv: HTTP GET /stock/sku\nInv--xCB: 500 / timeout (repeats, ratio > 50%)\nNote over CB: State: CLOSED -> OPEN (15 s)\nApp->>CB: GetStock(sku)\nCB-->>App: BrokenCircuitException (instant, no call)\nApp->>App: Fallback: cached stock + \"may be stale\"\nNote over CB: Break elapsed -> HALF-OPEN\nApp->>CB: GetStock(sku)\nCB->>Inv: Probe request\nInv-->>CB: 200 OK\nNote over CB: State: HALF-OPEN -> CLOSED\nCB-->>App: Fresh stock"),
q("DP","Outbox pattern — what dual-write problem does it solve, and how do you implement it?",
"<p>The dual-write problem: you save an order to the database <em>and</em> publish OrderPlaced to a broker. Any ordering of those two operations can fail halfway — order without event (inventory never reserves) or event without order (phantom work). Distributed transactions across DB+broker are not realistically available.</p>"+
"<p><strong>Outbox</strong>: write the event into an <code>outbox</code> table <em>in the same local transaction</em> as the business data. A separate dispatcher reads unpublished rows and publishes them, marking each done. Delivery becomes at-least-once — consumers must be idempotent (dedupe on message ID).</p>"+
"<pre><code>await using var tx = await db.Database.BeginTransactionAsync(ct);\ndb.Orders.Add(order);\ndb.Outbox.Add(OutboxMessage.From(new OrderPlaced(order.Id), correlationId));\nawait db.SaveChangesAsync(ct);\nawait tx.CommitAsync(ct);        // atomic: both or neither</code></pre>"+
"<div class='callout'><b>Real world</b>Debezium can tail the outbox table via CDC instead of a polling dispatcher — lower latency, no poll load. Libraries like MassTransit and Wolverine ship this as transactional outbox out of the box.</div>",
"sequenceDiagram\nautonumber\nparticipant API as Orders API\nparticipant DB as PostgreSQL\nparticipant DIS as Outbox Dispatcher\nparticipant MQ as Broker (SNS/Rabbit/Kafka)\nparticipant INV as Inventory Service\nAPI->>DB: BEGIN TX\nAPI->>DB: INSERT orders (881)\nAPI->>DB: INSERT outbox (OrderPlaced 881, published=false)\nAPI->>DB: COMMIT (atomic pair)\nDIS->>DB: SELECT * FROM outbox WHERE published=false FOR UPDATE SKIP LOCKED\nDB-->>DIS: OrderPlaced 881\nDIS->>MQ: Publish OrderPlaced 881\nMQ-->>DIS: Ack\nDIS->>DB: UPDATE outbox SET published=true\nMQ-->>INV: Deliver (at-least-once)\nINV->>INV: Idempotency check on messageId, then reserve stock");

/* ============ ARCHITECTURE ============ */
q("ARC","Clean Architecture — explain the dependency rule and how it maps to a real .NET solution.",
"<p>The dependency rule: source-code dependencies point <em>inward only</em>. The domain knows nothing about EF, ASP.NET, or AWS; outer layers implement interfaces the inner layers define.</p>"+
"<pre><code>src/\n  Domain/          entities, value objects, domain events, IOrderRepository\n  Application/     use cases (commands/queries + handlers), validators,\n                   port interfaces (IEmailSender, IClock, IPaymentGateway)\n  Infrastructure/  EF Core DbContext, repository impls, SES email, Stripe client\n  WebApi/          endpoints, auth, DI composition root, middleware</code></pre>"+
"<ul><li>Compile-time enforcement: Domain references nothing; Application references Domain; Infrastructure and WebApi reference inward. Add an architecture test (NetArchTest) so a sneaky <code>using Infrastructure;</code> fails CI.</li><li>The payoff is testability (use cases tested with in-memory ports) and replaceability at the edges (swap SES for SendGrid without touching business rules).</li><li>The cost is mapping and ceremony — which is why it fits systems with genuine domain logic, not CRUD-over-a-table admin apps.</li></ul>"),
q("ARC","CQRS — what is it really, when is it justified, and does it require event sourcing?",
"<p>CQRS separates the write model (commands enforcing invariants through aggregates) from the read model (queries shaped exactly for screens). It does <strong>not</strong> require event sourcing, separate databases, or messaging — the simplest honest form is: commands go through the domain; queries are Dapper/EF projections straight to DTOs.</p>"+
"<ul><li><strong>Justified when</strong>: read and write shapes diverge hard (order aggregate vs order-history grid), read:write ratio is lopsided, or reads need different scaling/storage (search index, cache, replica).</li><li><strong>Escalation levels</strong>: (1) same DB, separate models &rarr; (2) read replicas / materialised views &rarr; (3) separate read store fed by events — each step buys performance and costs consistency (the read side becomes eventually consistent; the UI must tolerate its own write appearing after a beat).</li><li><strong>Not justified</strong> as a default template on CRUD services — two models of the same table is pure tax.</li></ul>",
"sequenceDiagram\nautonumber\nparticipant UI as React Client\nparticipant API as API\nparticipant CH as Command Handler\nparticipant WDB as Write DB (normalised)\nparticipant P as Projector\nparticipant RDB as Read Store (denormalised)\nUI->>API: POST /orders (PlaceOrder)\nAPI->>CH: PlaceOrderCommand\nCH->>WDB: Load aggregate, enforce invariants, save + outbox event\nCH-->>API: 202 Accepted {orderId}\nWDB-->>P: OrderPlaced event (via outbox/CDC)\nP->>RDB: Upsert order-summary row (flat, screen-shaped)\nUI->>API: GET /orders?customer=42\nAPI->>RDB: Simple indexed read (no joins)\nRDB-->>API: Rows\nAPI-->>UI: 200 OK (may trail the write by ~100ms)"),
q("ARC","Monolith vs microservices — what actually decides it, beyond team size clichés?",
"<p>The honest drivers:</p>"+
"<ul><li><strong>Independent deployability need</strong>: do parts of the system genuinely change and ship at different cadences, owned by different teams? If one team ships everything together anyway, services add cost without benefit.</li><li><strong>Divergent scaling/runtime profiles</strong>: a GPU inference path, a spiky ingestion pipeline, and a steady CRUD API justify separation; three CRUD modules don't.</li><li><strong>Failure isolation and data ownership</strong>: are you prepared to give up cross-module ACID transactions and joins, and adopt sagas/outbox/eventual consistency? That's the real bill.</li><li><strong>Operational maturity</strong>: without CI/CD per service, centralised logging/tracing, and on-call depth, microservices convert one debuggable problem into a distributed murder mystery.</li></ul>"+
"<div class='callout'><b>Real world</b>Default position: start with a well-modularised monolith; extract a service when a specific module demonstrates a concrete need (scale, cadence, team ownership, tech mismatch) — extraction with evidence beats speculative decomposition every time.</div>"),
q("ARC","Modular monolith — how do you enforce module boundaries so it doesn't rot into a big ball of mud?",
"<ul><li><strong>One process, hard internal walls</strong>: each module (Ordering, Catalog, Billing) owns its domain, its data (separate schema; no cross-module table access), and a small public contract project. Internals are <code>internal</code>.</li><li><strong>Communication</strong>: cross-module calls go through public interfaces or in-process events/messages — never reaching into another module's DbContext. This keeps seams extraction-ready.</li><li><strong>Enforcement</strong>: solution structure + architecture tests (&ldquo;Ordering.Internals must not be referenced outside Ordering&rdquo;) + separate EF migrations per schema. Culture won't hold the line; CI will.</li></ul>"+
"<pre><code>Modules/\n  Ordering/  Ordering.Contracts/   // public: commands, events, DTOs\n             Ordering.Module/      // internal: domain, handlers, data\n  Catalog/   ...same shape...</code></pre>"+
"<p>Payoff: monolith economics (one deploy, real transactions, local debugging) with microservice-shaped seams — extracting Billing later is &ldquo;move the module, swap in-process bus for a broker,&rdquo; not a rewrite.</p>"),
q("ARC","Saga pattern — orchestration vs choreography for a multi-service order flow.",
"<p>A saga replaces a distributed transaction with a sequence of local transactions plus <strong>compensating actions</strong> for rollback.</p>"+
"<ul><li><strong>Choreography</strong>: services react to each other's events (OrderPlaced &rarr; inventory reserves &rarr; StockReserved &rarr; payment charges&hellip;). No central coordinator; but the workflow exists only implicitly across codebases — hard to see, hard to change, easy to create event cycles.</li><li><strong>Orchestration</strong>: an explicit saga/state machine (MassTransit saga, Temporal, Step Functions) commands each step and owns compensation. One place answers &ldquo;where is order 881 stuck?&rdquo;.</li></ul>"+
"<p>My rule: choreography for simple, stable, 2–3 step flows; orchestration once there's branching, timeouts, or money — auditability wins.</p>",
"sequenceDiagram\nautonumber\nparticipant O as Order Saga (Orchestrator)\nparticipant INV as Inventory\nparticipant PAY as Payments\nparticipant SHP as Shipping\nO->>INV: ReserveStock(order 881)\nINV-->>O: StockReserved\nO->>PAY: ChargeCard(881, 129.00)\nPAY--xO: PaymentFailed (card declined)\nNote over O: Enter compensation path\nO->>INV: ReleaseStock(881) [compensating action]\nINV-->>O: StockReleased\nO->>O: Mark order Failed(PaymentDeclined)\nO-->>SHP: (never called — step 3 not reached)"),
q("ARC","Event sourcing — genuine benefits, genuine costs, and where you'd draw the boundary.",
"<p>Instead of storing current state, you store the full sequence of domain events (OrderPlaced, ItemAdded, OrderPaid) and rebuild state by replay; read models are projections of the stream.</p>"+
"<ul><li><strong>Benefits</strong>: a perfect audit log by construction (finance/compliance love it), temporal queries (&ldquo;state as of March 3rd&rdquo;), retroactive new projections from history, and natural event-driven integration.</li><li><strong>Costs</strong>: event <em>versioning</em> is forever (old events never change; upcasters accumulate), eventual consistency of projections, snapshotting for long streams, harder ad-hoc querying, and a steep team learning curve. Deleting data (GDPR) needs crypto-shredding or careful design.</li></ul>"+
"<div class='callout'><b>Real world</b>Scope it to the aggregates where history <em>is</em> the business — ledgers, claims, bookings — and keep the rest of the system state-based. &ldquo;Event source everything&rdquo; is how platforms drown; a bounded context with EventStoreDB/Marten next to boring CRUD contexts is the sane shape.</div>"),
q("ARC","API Gateway vs BFF — what belongs at the edge, and when do you need per-client backends?",
"<ul><li><strong>Gateway</strong> (YARP, Kong, AWS API Gateway): one entry point handling cross-cutting edge concerns — TLS, authN, rate limiting, routing, coarse aggregation, WAF. Keep business logic out; a smart gateway becomes an unowned monolith in disguise.</li><li><strong>BFF (Backend-for-Frontend)</strong>: a thin backend per client type (web BFF, mobile BFF) that shapes and aggregates data for that UI — owned by the frontend-facing team. Mobile needs lean payloads and 1 round-trip; web wants rich objects; forcing one generic API to serve both breeds either chatty clients or bloated responses.</li><li>BFF also solves SPA token security: the BFF keeps tokens server-side in an HttpOnly cookie session, so no bearer tokens live in browser storage.</li></ul>"+
"<div class='callout'><b>Real world</b>Typical shape: CloudFront + WAF &rarr; gateway (auth, throttling) &rarr; web BFF and mobile BFF &rarr; domain services. Add a BFF when client-shaping logic starts leaking into either the gateway or the domain services — that leak is the signal.</div>"),
q("ARC","Vertical slice architecture vs layered — compare how a feature change flows through each.",
"<p><strong>Layered</strong> organises by technical role (Controllers/, Services/, Repositories/) — one feature change touches every folder, and layers accrete pass-through methods. <strong>Vertical slice</strong> organises by feature: everything for &ldquo;CancelOrder&rdquo; lives together.</p>"+
"<pre><code>Features/\n  Orders/\n    CancelOrder/\n      CancelOrderEndpoint.cs      // minimal API mapping\n      CancelOrderCommand.cs\n      CancelOrderHandler.cs       // its own data access, tuned for this case\n      CancelOrderValidator.cs\n      CancelOrderTests.cs</code></pre>"+
"<ul><li>Each slice picks the simplest implementation it needs — a Dapper query here, full aggregate + domain events there. No forced uniform abstraction.</li><li>Coupling <em>between</em> slices is the danger: shared domain entities and shared infrastructure are fine; slice-to-slice calls are not — route shared logic into the domain layer, not into a neighbouring slice.</li><li>Slices pair naturally with MediatR/minimal APIs and make PR review scope obvious: one feature, one folder.</li></ul>"),
q("ARC","DDD bounded contexts — how do you find the boundaries, and what goes wrong without them?",
"<p>A bounded context is a boundary within which a model and its language are consistent. The tell that you've crossed one: the <em>same word means different things</em>. &ldquo;Product&rdquo; to Catalog is descriptions and images; to Inventory it's stock units and locations; to Billing it's a price and tax code. Forcing one Product class to serve all three creates the classic god-entity with 90 nullable properties.</p>"+
"<ul><li><strong>Finding boundaries</strong>: follow the language (where definitions shift), the teams (Conway), and the transactional needs (what must be consistent <em>together</em>). Event-storming workshops surface all three quickly.</li><li><strong>Between contexts</strong>: translate explicitly — context maps with anti-corruption layers, published language (events/contracts), or customer–supplier relationships. Never share domain entities across contexts; share IDs and contracts.</li><li>Bounded contexts are the only defensible unit for extracting microservices — cutting along entity lines instead (an &ldquo;Order service&rdquo; that every workflow must call synchronously) recreates the monolith with network calls inside.</li></ul>"),
q("ARC","Strangler fig migration — how do you actually retire a legacy system without a big-bang rewrite?",
"<ol><li><strong>Put a facade in front</strong> (gateway/reverse proxy) so every consumer hits the facade, not the legacy directly. Now routing is your migration lever.</li><li><strong>Pick slices by value &times; separability</strong> — first something self-contained with real pain (e.g., the pricing module), not the gnarliest core.</li><li><strong>Build the slice in the new system</strong>; sync data during transition (CDC from legacy DB, or dual-write with reconciliation reports — prefer CDC; dual-writes drift).</li><li><strong>Shadow, then shift</strong>: mirror traffic to the new implementation and diff outputs; then route 1% &rarr; 10% &rarr; 100% with instant rollback at the facade.</li><li><strong>Delete legacy code per slice</strong> — a strangler that never deletes is just two systems forever, which is the most common real-world failure mode of this pattern.</li></ol>"+
"<div class='callout'><b>Real world</b>Migrating a legacy commerce platform: checkout moved first behind the proxy, ran shadowed for three weeks catching two pricing edge cases, then took 100% traffic. Eighteen months of slices later the legacy box served only an admin report — then nothing.</div>");

/* ============ SYSTEM DESIGN ============ */
q("SYS","Design the caching layer for a read-heavy product API. Explain cache-aside and its failure modes.",
"<p><strong>Cache-aside</strong>: app checks the cache; on miss, reads the DB, populates the cache with a TTL, returns. On write, <em>invalidate</em> (delete) the key rather than updating it — updates race, deletes converge.</p>"+
"<p>Failure modes you must design for:</p>"+
"<ul><li><strong>Stampede</strong>: a hot key expires and 5,000 requests hit the DB simultaneously. Fixes: per-key locking/single-flight, probabilistic early refresh, or serve-stale-while-revalidate.</li><li><strong>Penetration</strong>: requests for keys that never exist bypass the cache every time — cache negative results briefly, or bloom-filter known IDs.</li><li><strong>Inconsistency window</strong>: between DB commit and cache delete, readers may cache stale data — keep TTLs as the safety net (nothing stays wrong forever).</li></ul>",
"sequenceDiagram\nautonumber\nparticipant C as Client\nparticipant API as Product API\nparticipant R as Redis\nparticipant DB as PostgreSQL\nC->>API: GET /products/42\nAPI->>R: GET product:42\nR-->>API: MISS\nAPI->>R: SET lock:product:42 NX EX 5 (single-flight)\nAPI->>DB: SELECT ... WHERE id=42\nDB-->>API: Row\nAPI->>R: SET product:42 (TTL 300s + jitter)\nAPI-->>C: 200 OK\nNote over API,R: Later: product updated\nAPI->>DB: UPDATE products SET ... WHERE id=42\nAPI->>R: DEL product:42 (invalidate, not update)\nC->>API: Next GET repopulates fresh"),
q("SYS","L4 vs L7 load balancing — what does each see, and how does that drive real choices?",
"<ul><li><strong>L4 (transport)</strong> — e.g., AWS NLB: routes on IP/port, doesn't parse HTTP. Millions of connections, ultra-low latency, static IPs, TLS passthrough possible. Blind to paths, headers, cookies.</li><li><strong>L7 (application)</strong> — e.g., AWS ALB, NGINX, Envoy: terminates TLS, reads the request. Enables path routing (<code>/api/orders</code> &rarr; orders service), header/weight-based canaries, sticky sessions, WebSocket/gRPC awareness, auth offload.</li></ul>"+
"<p>Choices that follow:</p>"+
"<ul><li>Public HTTP APIs and microservice routing: L7 (you want canary weights and per-path health).</li><li>Raw TCP (MQTT brokers, database proxies, game servers) or when the backend must terminate TLS itself (mTLS to the pod): L4.</li><li>Common production stack: NLB (static IPs for allow-listing) &rarr; ALB/Envoy (routing) &rarr; services.</li><li>Algorithms: <em>least outstanding requests</em> beats round-robin when response times vary; consistent hashing when backends keep per-key state/caches.</li></ul>"),
q("SYS","Your primary database is out of write headroom. Walk through sharding: strategy, key choice, and what breaks.",
"<p>First say the quiet part: sharding is the <em>last</em> resort — after read replicas, caching, table partitioning, and buying a bigger box. It permanently complicates the system.</p>"+
"<ul><li><strong>Strategy</strong>: hash sharding (uniform spread, no range hotspots; range queries scatter) vs range sharding (great time locality; hot &ldquo;latest&rdquo; shard) vs directory/lookup (flexible, adds a routing dependency).</li><li><strong>Key choice is destiny</strong>: pick the key most queries carry — <code>tenant_id</code> or <code>customer_id</code> — so requests stay single-shard. A whale tenant = hot shard: plan for tenant-level splits or dedicated shards.</li><li><strong>What breaks</strong>: cross-shard joins (denormalise or query-fan-in at the app), cross-shard transactions (sagas/outbox), global unique IDs (ULID/Snowflake, not identity columns), global secondary lookups (async-maintained index tables), and rebalancing (use consistent hashing or virtual shards from day one so moving data isn't a rewrite).</li></ul>"+
"<div class='callout'><b>Real world</b>Shard by tenant, route in a thin data-access layer, keep a shard map in config/consul — and instrument per-shard load from day one, because the first whale arrives sooner than you think.</div>"),
q("SYS","CAP and PACELC — translate the theory into decisions an engineer actually makes.",
"<p>CAP: during a network <strong>P</strong>artition you choose <strong>C</strong>onsistency (refuse some requests) or <strong>A</strong>vailability (serve possibly-stale data). Partitions are rare; <strong>PACELC</strong> adds the everyday trade-off: <em>Else</em> (normal operation), you trade <strong>L</strong>atency vs <strong>C</strong>onsistency — every synchronous replica ack you wait for is user-visible latency.</p>"+
"<p>Decisions this actually drives:</p>"+
"<ul><li>Quorum tuning: DynamoDB/Cassandra-style <code>R + W &gt; N</code> for strong reads, or eventual reads for speed — per table, per operation.</li><li>Sync vs async replication: money movements wait for the standby ack (PC/EC); a social feed doesn't (PA/EL).</li><li>Per-feature, not per-system: the same platform can serve <em>your own cart</em> read-your-writes consistent while product view counts are eventual. Saying &ldquo;consistency is a per-endpoint dial, not a database brand&rdquo; is the senior answer.</li></ul>"),
q("SYS","Design idempotency for a payment API. The client timed out and retried — how do you not charge twice?",
"<p>At-least-once delivery is reality (client retries, queue redeliveries), so the charge operation itself must be idempotent.</p>"+
"<ol><li>Client generates an <strong>idempotency key</strong> (UUID per logical attempt) and sends it as a header on POST.</li><li>Server atomically inserts <code>(key, status=in_progress)</code> — a unique constraint makes concurrent duplicates lose cleanly.</li><li>First request executes the charge, stores the response against the key, returns it.</li><li>Retries with the same key: if completed &rarr; replay the stored response; if in-progress &rarr; 409/425 (retry later) — never a second charge.</li><li>Keys expire after ~24–72 h; scope them per operation type and per merchant.</li></ol>"+
"<pre><code>INSERT INTO idempotency (key, status, request_hash)\nVALUES (@key, 'in_progress', @hash)\nON CONFLICT (key) DO NOTHING;   -- 0 rows = duplicate: fetch and replay</code></pre>"+
"<p>Also hash the request body: same key + different payload = 422, catching client bugs. This is exactly how Stripe's API behaves — worth citing in an interview.</p>"),
q("SYS","Design a distributed rate limiter. Compare algorithms and handle the multi-node problem.",
"<ul><li><strong>Fixed window</strong>: simple counters, but 2&times; bursts at window edges.</li><li><strong>Sliding window log</strong>: exact, but stores a timestamp per request — memory-heavy.</li><li><strong>Sliding window counter</strong>: weighted blend of two windows — good accuracy, tiny state; the practical default.</li><li><strong>Token bucket</strong>: allows controlled bursts with steady refill — best developer experience for public APIs.</li></ul>"+
"<p>Multi-node: per-instance limits multiply by node count, so centralise state in Redis with an atomic Lua script (check + decrement in one step). Latency-sensitive fleets use local pre-allocation: each node leases a slice of the budget and syncs asynchronously — slightly loose, massively cheaper.</p>"+
"<pre><code>-- Redis token bucket (atomic Lua, per api-key)\nlocal tokens = redis.call('GET', KEYS[1]) or ARGV[1]  -- capacity\n-- refill by elapsed*rate, floor at capacity, then take 1 or reject</code></pre>"+
"<p>Return <code>429</code> with <code>Retry-After</code> and <code>X-RateLimit-Remaining</code>; fail <em>open</em> for brief limiter outages on paid APIs, fail <em>closed</em> on abuse-sensitive endpoints (login, OTP).</p>"),
q("SYS","Classic: design a URL shortener. Hit the parts interviewers actually probe.",
"<ol><li><strong>ID generation</strong>: base62-encode a distributed sequence (Snowflake/segmented ranges per node) — 7 chars &asymp; 3.5 trillion codes. Avoid hashing the URL alone (collisions, and same-URL-different-owner needs distinct codes). Custom aliases: unique-constraint insert, first wins.</li><li><strong>Storage</strong>: a key&rarr;value row (<code>code, target, owner, created, expiry</code>). This is read-dominated 100:1 — so the real design is the read path: cache hot codes in Redis (LRU), CDN-cache the 301 for immutables.</li><li><strong>Redirect semantics</strong>: 301 (permanent, cached by browsers — cheapest) vs 302/307 if you need per-click analytics; then log clicks asynchronously (queue &rarr; aggregator), never synchronously in the redirect path.</li><li><strong>Abuse</strong>: malware URL scanning on create, rate limits, per-owner quotas — interviewers reward candidates who raise this unprompted.</li><li><strong>Scale math out loud</strong>: 100M new/month &asymp; 40 writes/s but redirects at 10k+/s — proves the cache/CDN emphasis is justified.</li></ol>"),
q("SYS","Kafka vs SQS/RabbitMQ — queues vs logs, and how consumer models differ.",
"<p><strong>Queues</strong> (SQS, RabbitMQ): a message is a unit of <em>work</em> — consumed, acked, gone. Competing consumers scale naturally; per-message routing, delays and DLQs are first-class. <strong>Logs</strong> (Kafka, Kinesis): a message is a <em>fact</em> in an ordered, retained stream — consumers track their own offsets, can replay history, and multiple independent groups read the same data.</p>"+
"<ul><li>Choose a queue for task distribution: send-this-email, process-this-image. Simple, cheap, operationally boring.</li><li>Choose a log for event streams multiple systems consume (order events feeding search, analytics, and fraud), event sourcing, CDC pipelines, and replay-to-rebuild-a-projection.</li><li>Ordering: Kafka guarantees order per partition — your partition key (e.g., orderId) defines it; queues generally don't (FIFO variants trade throughput).</li><li>Ops honesty: Kafka is a platform commitment (partitions, rebalancing, retention tuning); don't deploy it to move 50 messages/minute between two services.</li></ul>"),
q("SYS","How do you serve a global audience fast? CDN strategy beyond &ldquo;put CloudFront in front&rdquo;.",
"<ul><li><strong>Asset strategy</strong>: immutable, content-hashed filenames with <code>Cache-Control: max-age=31536000, immutable</code>; HTML short-TTL or no-store. Deploys become instant because only HTML changes.</li><li><strong>Dynamic content at the edge</strong>: cache API GETs with short TTL + <code>stale-while-revalidate</code>; vary cache keys deliberately (device class, currency) — every Vary dimension multiplies cache entries and slashes hit ratio.</li><li><strong>Origin protection</strong>: origin shield / request collapsing so a cache-miss storm doesn't stampede origin; signed URLs for private media.</li><li><strong>Data locality is the hard part</strong>: static content is easy; user data isn't. Options ladder: single-region DB + edge caching (fine for most), read replicas per region (reads local, writes home), true multi-region active-active (DynamoDB global tables/CRDTs) only when the product demands it — write conflicts are a business problem, not a config flag.</li><li>Measure with RUM from real user geographies, not from your office.</li></ul>"),
q("SYS","Logs, metrics, traces — design observability so a 3 a.m. incident is diagnosable in minutes.",
"<ul><li><strong>Metrics</strong> (aggregates, cheap, alertable): RED per service — Rate, Errors, Duration (P50/P95/P99) — plus saturation (CPU, connections, queue depth). Alert on symptoms users feel (error rate, latency SLO burn), not on causes (CPU).</li><li><strong>Structured logs</strong>: JSON with <code>traceId</code>, tenant, and business IDs (orderId) on every line; log sampling for high-volume success paths, never for errors.</li><li><strong>Distributed traces</strong> (OpenTelemetry): one traceId propagated across HTTP and message hops — the only tool that answers &ldquo;where did the 4 seconds go across six services?&rdquo;. Tail-sample so slow/error traces are always kept.</li></ul>"+
"<p>The glue is correlation: alert fires &rarr; dashboard shows which service's P99 broke &rarr; exemplar trace shows the slow span &rarr; logs filtered by that traceId show the exact failure. If any hop in that chain requires grep-and-hope, the design isn't done. Add SLOs with error budgets so &ldquo;is this bad enough to page?&rdquo; has a numeric answer.</p>");

/* ============ SOLID ============ */
q("SOL","Single Responsibility — define it precisely and refactor a realistic violation.",
"<p>Precise definition: a module should have <em>one reason to change</em> — one stakeholder/axis of change, not &ldquo;one method&rdquo; or &ldquo;does one thing&rdquo;.</p>"+
"<pre><code>// Violation: three reasons to change in one class\npublic class InvoiceService {\n    public Invoice Calculate(Order o) { ... }        // pricing rules (business)\n    public byte[] RenderPdf(Invoice i) { ... }       // layout (design team)\n    public Task EmailAsync(Invoice i) { ... }        // delivery (infrastructure)\n}\n\n// After: each changes for exactly one reason\npublic sealed class InvoiceCalculator { ... }        // tax rule changes\npublic sealed class InvoicePdfRenderer : IInvoiceRenderer { ... }\npublic sealed class InvoiceDispatcher(IInvoiceRenderer r, IEmailSender s) { ... }</code></pre>"+
"<p>Real consequences of the violation: the pricing change and the letterhead change land in the same file (merge conflicts, tangled reviews), and testing tax logic drags in PDF and SMTP dependencies. Counterweight: don't shard into confetti — cohesion matters; things that always change together belong together.</p>"),
q("SOL","Open/Closed — how do you achieve &ldquo;open for extension, closed for modification&rdquo; without over-abstracting?",
"<p>OCP means new behaviour arrives as <em>new code</em>, not edits to tested code. The mechanism is polymorphism at identified <strong>variation points</strong> — not interfaces on everything.</p>"+
"<pre><code>// Closed core, open extension: discount rules\npublic interface IDiscountRule { Money Apply(Order o, Money current); }\n\npublic sealed class DiscountEngine(IEnumerable&lt;IDiscountRule&gt; rules) {\n    public Money Total(Order o) =&gt;\n        rules.Aggregate(o.GrossTotal, (t, r) =&gt; r.Apply(o, t));\n}\n// Black Friday rule = new class + DI registration. Engine untouched.</code></pre>"+
"<ul><li>Apply it where change has <em>already happened twice</em> — the second discount type justifies the abstraction; speculative variation points are dead weight (YAGNI).</li><li>Modern C# alternative at small scale: a switch over a sealed hierarchy — the compiler's exhaustiveness warning makes &ldquo;modification&rdquo; safe and visible. OCP is a goal; not every goal needs an interface.</li></ul>"),
q("SOL","Liskov Substitution — give a violation that type-checks fine but breaks at runtime.",
"<p>LSP: a subtype must honour the base type's <em>behavioural contract</em> — preconditions can't strengthen, postconditions can't weaken, invariants hold. The compiler can't check this; production does.</p>"+
"<pre><code>// Classic .NET violation:\nICollection&lt;int&gt; c = new ReadOnlyCollection&lt;int&gt;(list);\nc.Add(4);   // compiles; throws NotSupportedException at runtime\n\n// Domain version:\npublic class Rectangle { public virtual int W {get;set;} public virtual int H {get;set;} }\npublic class Square : Rectangle {\n    public override int W { set { base.W = base.H = value; } }  // breaks invariant\n}\n// Any code that sets W then H on a \"Rectangle\" now silently misbehaves.</code></pre>"+
"<p>Smells: <code>NotSupportedException</code> in overrides, <code>is</code>-type checks before calling members, overrides that no-op. Fixes: split the contract (<code>IReadOnlyList</code> vs <code>IList</code> — the BCL's own LSP repair), prefer composition over inheritance, and model with immutable values (a record <code>Square(int Side)</code> has no setter to violate).</p>"),
q("SOL","Interface Segregation — show a fat interface causing real damage and the segregated fix.",
"<pre><code>// Fat: every notification channel must implement everything\npublic interface INotifier {\n    Task SendEmailAsync(Email e);\n    Task SendSmsAsync(Sms s);\n    Task SendPushAsync(Push p);\n    Task&lt;DeliveryReport&gt; GetReportAsync(Guid id);\n}\n// SmsNotifier: 3 of 4 methods throw NotSupported → ISP and LSP violated together.</code></pre>"+
"<p>Damage: mocks must stub members the test never uses; adding <code>SendWhatsAppAsync</code> forces edits to every implementor; consumers depend on capabilities they don't call, so any change ripples everywhere.</p>"+
"<pre><code>public interface IEmailSender { Task SendAsync(Email e); }\npublic interface ISmsSender   { Task SendAsync(Sms s); }\npublic interface IDeliveryReporting { Task&lt;DeliveryReport&gt; GetAsync(Guid id); }\n// Twilio adapter implements ISmsSender + IDeliveryReporting. Nothing throws.</code></pre>"+
"<p>Heuristic: design interfaces from the <em>consumer's</em> needs (role interfaces), not the provider's feature list. Many small interfaces on one class is normal and healthy.</p>"),
q("SOL","Dependency Inversion vs Dependency Injection — most candidates conflate them. Untangle it.",
"<p><strong>DIP</strong> is an architecture principle: high-level policy must not depend on low-level detail; both depend on abstractions — and crucially, <em>the high-level module owns the abstraction</em>. <strong>DI</strong> is merely a technique for supplying dependencies (constructor injection, a container). You can use DI everywhere and still violate DIP.</p>"+
"<pre><code>// DI without DIP: injected, but the abstraction lives in and mirrors the infrastructure\npublic class OrderService(SqlOrderTable table) { ... }          // concrete infra\n\n// DIP: Domain defines the port; infrastructure implements it\n// Domain project:\npublic interface IOrderRepository { Task&lt;Order?&gt; GetAsync(OrderId id, CancellationToken ct); }\n// Infrastructure project:\npublic sealed class EfOrderRepository(AppDbContext db) : IOrderRepository { ... }</code></pre>"+
"<p>The arrow that matters is the <em>project reference</em>: Infrastructure references Domain, never the reverse — that inversion is what makes Clean/Hexagonal architecture work, keeps domain tests dependency-free, and lets you swap EF/S3/Stripe at the edge. DI is just how the pieces get glued at the composition root.</p>"),
q("SOL","How do the SOLID principles physically manifest in a Clean Architecture solution?",
"<ul><li><strong>SRP</strong> &rarr; use-case classes: one handler per command/query, each with one reason to change; layers themselves separate business vs delivery vs persistence concerns.</li><li><strong>OCP</strong> &rarr; new features are new slices/handlers and new adapter implementations — the composition root registers more, existing handlers stay untouched.</li><li><strong>LSP</strong> &rarr; every <code>IEmailSender</code>/<code>IPaymentGateway</code> implementation must be behaviourally interchangeable, or the domain's guarantees silently break when config swaps an adapter.</li><li><strong>ISP</strong> &rarr; ports are narrow, consumer-shaped interfaces (<code>IClock</code>, <code>IOrderReader</code>), not one <code>IDataAccess</code> monster.</li><li><strong>DIP</strong> &rarr; the dependency rule itself: Domain/Application define ports; Infrastructure implements them; project references all point inward.</li></ul>"+
"<p>Interview framing: Clean Architecture isn't a separate idea to memorise — it's SOLID (mainly DIP + SRP) applied at solution-structure scale, enforced by the compiler through project references.</p>"),
q("SOL","When does applying SOLID become harmful? Give concrete over-engineering symptoms.",
"<p>Uncomfortable truth: SOLID applied as ritual produces worse codebases than mild pragmatic coupling. Symptoms I reject in review:</p>"+
"<ul><li><strong>Interface-per-class with one implementation forever</strong> — navigation now bounces through <code>IFoo</code> to find <code>Foo</code>; zero polymorphism gained. Interfaces are for genuine seams (boundaries, test isolation of I/O, real variation).</li><li><strong>Layered pass-throughs</strong>: controller &rarr; service &rarr; manager &rarr; repository where three of four just forward the call — SRP misread as &ldquo;every noun gets a class&rdquo;.</li><li><strong>Speculative OCP</strong>: plugin architectures for variation that never arrives; config flags nobody flips.</li><li><strong>Abstraction leak tax</strong>: wrapping EF/HttpClient so thoroughly that every new feature needs edits in five projects to pass one new parameter.</li></ul>"+
"<p>The test I apply: does this abstraction earn its indirection with testability, a real boundary, or actual variation <em>today</em>? Principles guide trade-offs; they aren't compliance checkboxes. Duplication is cheaper than the wrong abstraction.</p>"),
q("SOL","Composition over inheritance — why does the industry prefer it, and where does inheritance still win?",
"<p>Inheritance is the strongest coupling a language offers: subclasses depend on parent <em>implementation details</em> (the fragile base class problem), hierarchies are single-axis (SmsNotifier + RetryingNotifier + LoggingNotifier can't combine), and deep trees turn every base change into a minefield.</p>"+
"<pre><code>// Composition: capabilities as injected parts, combinable at will\npublic sealed class NotificationService(\n    IMessageSender sender,        // Sms / Email / Push\n    IRetryPolicy retry,           // decorator-style\n    INotificationLog log) { ... }</code></pre>"+
"<ul><li>Each part is testable alone; combinations are wiring, not new classes; behaviour can change at runtime.</li><li>Inheritance still wins for: genuine is-a with a stable contract — framework template methods (<code>ControllerBase</code>, <code>BackgroundService</code>), exception hierarchies, and small <code>abstract</code> base classes capturing an algorithm skeleton where subclasses fill steps.</li><li>Guardrails when you do inherit: keep it shallow (1–2 levels), design for inheritance explicitly or mark <code>sealed</code> — sealed-by-default is the composition mindset applied to class design.</li></ul>"),
q("SOL","Law of Demeter — how does &ldquo;don't talk to strangers&rdquo; relate to SOLID, and what's the caveat?",
"<p>LoD: a method should touch its own fields, its parameters, and objects it creates — not reach through them (<code>order.Customer.Address.Country.TaxRegime</code>). Each dot in a train is a structural dependency: renaming <code>Address</code> now breaks code four objects away.</p>"+
"<pre><code>// Train wreck (knows 4 shapes)          // Tell, don't ask (knows 1 contract)\nvar rate = order.Customer.Address        var rate = order.TaxRateFor(catalog);\n    .Country.TaxRegime.RateFor(item);</code></pre>"+
"<ul><li>Relation to SOLID: it's coupling control in the small — supporting SRP (logic lands on the object owning the data) and reducing the surface DIP has to invert. Violations also produce untestable code: mocking a chain of getters is misery.</li><li><strong>Caveat</strong>: LoD applies to <em>objects with behaviour</em>, not data. Mapping a DTO, LINQ pipelines, or reading config via dotted paths is fine — wrapping every property access in a delegating method creates the pass-through bloat you were avoiding. Judge by &ldquo;whose decision is this?&rdquo;, not by counting dots.</li></ul>"),
q("SOL","Connect SOLID to testability — which principle failure causes which testing pain?",
"<ul><li><strong>SRP failure</strong> &rarr; giant arrange blocks: testing one behaviour forces constructing mail servers and PDF engines. Test files hundreds of lines long for trivial assertions are an SRP smell in the production code, not the tests.</li><li><strong>OCP failure</strong> &rarr; every new case edits a god-switch, so every existing test around it must be revisited; regression risk concentrates in one file.</li><li><strong>LSP failure</strong> &rarr; green tests, red production: the test double honours the contract, the real implementation throws <code>NotSupported</code> — your suite verified a fiction.</li><li><strong>ISP failure</strong> &rarr; mock setup for members the code under test never calls; refactoring any part of the fat interface breaks unrelated test files.</li><li><strong>DIP failure</strong> &rarr; the big one: business logic newing up <code>SqlConnection</code>/<code>HttpClient</code> can only be integration-tested — slow suites, flaky CI, and eventually a team that stops writing tests.</li></ul>"+
"<p>Practical corollary: &ldquo;hard to test&rdquo; is the cheapest early-warning system for design problems — listen to it before reaching for a more powerful mocking framework.</p>");

/* ============ REACT ============ */
q("REA","Explain reconciliation and why keys matter. What bug does index-as-key cause?",
"<p>On re-render React diffs the new element tree against the old. Same type in the same position &rarr; update in place; different type &rarr; unmount/remount. For lists, <strong>keys</strong> tell React which items are <em>the same entity</em> across renders.</p>"+
"<p>Index-as-key bug: delete the first row of a list of stateful rows (inputs, checkboxes). Indices shift, so React thinks item 0 &ldquo;changed its data&rdquo; rather than &ldquo;was removed&rdquo; — DOM state (focus, input text, animation) sticks to positions and shows against the <em>wrong records</em>.</p>"+
"<pre><code>{items.map((it, i) =&gt; &lt;Row key={i} .../&gt;)}      // ✗ state bleeds on insert/remove/sort\n{items.map(it =&gt; &lt;Row key={it.id} .../&gt;)}       // ✓ stable identity</code></pre>"+
"<ul><li>Index is acceptable only for static, never-reordered, stateless lists.</li><li>Bonus: changing a key on purpose (<code>key={selectedUserId}</code>) force-remounts a component — the idiomatic way to reset a form when the subject changes.</li></ul>"),
q("REA","useEffect data fetching — show the race condition and the correct pattern.",
"<p>The race: user types &ldquo;a&rdquo; then &ldquo;ab&rdquo;; two fetches start; the &ldquo;a&rdquo; response arrives <em>last</em> and overwrites the correct &ldquo;ab&rdquo; results. Effects need cleanup that cancels or ignores stale responses:</p>"+
"<pre><code>useEffect(() =&gt; {\n  const ctrl = new AbortController();\n  fetch(`/api/search?q=${query}`, { signal: ctrl.signal })\n    .then(r =&gt; r.json())\n    .then(setResults)\n    .catch(e =&gt; { if (e.name !== 'AbortError') setError(e); });\n  return () =&gt; ctrl.abort();      // cancels the stale request on re-run/unmount\n}, [query]);</code></pre>"+
"<ul><li>Other effect discipline: dependencies must be honest (lint rule on); effects are for synchronising with <em>external</em> systems — deriving state from props/state belongs in render or <code>useMemo</code>, and handling user actions belongs in event handlers, not effects watching flags.</li><li>Senior answer: in product code, don't hand-roll this — React Query/SWR handle races, caching, retries and deduplication; raw <code>useEffect</code> fetching is for understanding, not shipping.</li></ul>"),
q("REA","useMemo and useCallback — when do they actually help, and when are they noise?",
"<p>They memoise between renders: <code>useMemo</code> a computed value, <code>useCallback</code> a function identity. They help in exactly three cases:</p>"+
"<ol><li>Genuinely expensive computation (sorting/filtering thousands of rows) re-running on unrelated renders.</li><li>Preserving <em>referential identity</em> for a prop passed to a <code>React.memo</code> child — without it, the memo is defeated every render by a fresh function/object.</li><li>Stabilising a dependency used inside another hook's dependency array.</li></ol>"+
"<pre><code>const visible = useMemo(\n  () =&gt; rows.filter(r =&gt; r.status === filter).sort(bySelected(sortKey)),\n  [rows, filter, sortKey]);\n\nconst onSelect = useCallback((id) =&gt; dispatch({type:'select', id}), [dispatch]);\n&lt;HugeTable rows={visible} onSelect={onSelect} /&gt;   // HugeTable is React.memo'd</code></pre>"+
"<p>Noise: memoising cheap expressions &ldquo;for performance&rdquo; adds comparison cost and reading friction with zero gain — profile first (React DevTools Profiler), memoise what it indicts. The React Compiler is making much of this automatic, which tells you it was overhead, not architecture.</p>"),
q("REA","Context vs Redux vs Zustand vs server-state libraries — give a decision framework.",
"<p>First split the state by kind — most &ldquo;state management problems&rdquo; are category errors:</p>"+
"<ul><li><strong>Server state</strong> (data fetched from APIs): React Query/SWR — caching, revalidation, optimistic updates. Moving this out typically deletes half the Redux store.</li><li><strong>Local UI state</strong>: <code>useState</code>/<code>useReducer</code> in the component. Don't globalise a modal flag.</li><li><strong>Shared client state</strong> (theme, auth session, cart): Context for low-frequency values; Zustand when updates are frequent or you need selector-based subscriptions without provider pyramids.</li><li><strong>Complex, event-driven app state</strong> (multi-step editors, undo/redo, heavy middleware/devtools needs): Redux Toolkit still earns its structure.</li></ul>"+
"<p>Context caveat: every consumer re-renders on any value change — split contexts by concern and memoise the value, or it becomes a performance foot-gun. Interview-grade summary: &ldquo;React Query for server state eliminated most of our global store; what remained fit in two Zustand slices.&rdquo;</p>"),
q("REA","Controlled vs uncontrolled forms — trade-offs, and how modern form libraries exploit both.",
"<ul><li><strong>Controlled</strong>: value lives in React state; every keystroke re-renders. You get instant validation, conditional fields, and programmatic control — at the cost of render pressure on large forms.</li><li><strong>Uncontrolled</strong>: the DOM holds the value; read via ref/FormData on submit. Minimal renders, less code — but reactive cross-field logic is awkward.</li></ul>"+
"<pre><code>// React Hook Form: uncontrolled inputs + subscription model\nconst { register, handleSubmit, formState:{errors} } = useForm();\n&lt;input {...register('email', { required: true, pattern: /.+@.+/ })} /&gt;\n{errors.email &amp;&amp; &lt;span&gt;Valid email required&lt;/span&gt;}</code></pre>"+
"<p>RHF registers uncontrolled inputs and subscribes to changes selectively — a 60-field form doesn't re-render the world per keystroke, which is exactly why it beat naive controlled patterns in the ecosystem. My rule: RHF + a Zod schema (shared with the API layer) for real forms; a lone controlled input is fine for a search box. Mention that React 19 form actions are moving submission handling into the framework.</p>"),
q("REA","How does React Query manage server state? Explain staleness, caching, and an optimistic update.",
"<p>Core model: every query has a key; results are cached and served <em>instantly</em> while a background refetch runs if the data is stale (<code>stale-while-revalidate</code>). <code>staleTime</code> controls how long data is trusted; <code>gcTime</code> how long unused cache lives. Refetch triggers: mount, window focus, reconnect, interval.</p>"+
"<pre><code>const qc = useQueryClient();\nconst { data } = useQuery({ queryKey: ['todos'], queryFn: fetchTodos, staleTime: 30_000 });\n\nconst add = useMutation({ mutationFn: postTodo,\n  onMutate: async (todo) =&gt; {                     // optimistic\n    await qc.cancelQueries({ queryKey: ['todos'] });\n    const prev = qc.getQueryData(['todos']);\n    qc.setQueryData(['todos'], (old) =&gt; [...old, {...todo, id: 'tmp'}]);\n    return { prev };\n  },\n  onError: (_e, _t, ctx) =&gt; qc.setQueryData(['todos'], ctx.prev),   // rollback\n  onSettled: () =&gt; qc.invalidateQueries({ queryKey: ['todos'] }),   // truth wins\n});</code></pre>"+
"<p>What it deletes from your codebase: loading/error boilerplate, manual dedupe of identical in-flight requests, hand-rolled caches, and the race conditions of effect-based fetching. Query keys are the API — structure them (<code>['orders', {customerId}]</code>) so invalidation can target precisely.</p>"),
q("REA","Design code splitting for a large React app — routes, components, and the UX of loading.",
"<pre><code>const AdminArea = lazy(() =&gt; import('./admin/AdminArea'));   // route-level: biggest win\n\n&lt;Suspense fallback={&lt;RouteSkeleton /&gt;}&gt;\n  &lt;Routes&gt;\n    &lt;Route path=\"/admin/*\" element={&lt;AdminArea /&gt;} /&gt;\n  &lt;/Routes&gt;\n&lt;/Suspense&gt;</code></pre>"+
"<ul><li><strong>Split by route first</strong> — users shouldn't download the admin dashboard to view a product page. Then split heavy leaf components (chart library, rich-text editor, PDF viewer) that most sessions never open.</li><li><strong>UX rules</strong>: skeletons over spinners; place Suspense boundaries so navigation chrome stays interactive while content loads; preload on intent (<code>onMouseEnter</code> triggers the <code>import()</code>) to hide latency.</li><li><strong>Resilience</strong>: chunk fetches fail after deploys change hashes — wrap lazy in a retry/reload-once handler.</li><li>Verify with a bundle analyzer; the goal is a small, stable vendor chunk + per-route chunks, and no accidental &ldquo;everything imports the barrel file&rdquo; graph that defeats splitting.</li></ul>"),
q("REA","What makes a custom hook well-designed? Show one worth extracting.",
"<p>A good hook extracts <em>reusable stateful behaviour</em> with a clean contract: clear inputs, stable outputs, no hidden coupling to a specific component, and complete lifecycle hygiene (cleanup, cancellation).</p>"+
"<pre><code>function useDebouncedValue&lt;T&gt;(value: T, ms = 300): T {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() =&gt; {\n    const t = setTimeout(() =&gt; setDebounced(value), ms);\n    return () =&gt; clearTimeout(t);        // cleanup on change/unmount\n  }, [value, ms]);\n  return debounced;\n}\n\n// Composition: hooks building on hooks\nconst debouncedQuery = useDebouncedValue(query);\nconst results = useQuery({ queryKey: ['search', debouncedQuery],\n                           queryFn: () =&gt; search(debouncedQuery),\n                           enabled: debouncedQuery.length &gt; 1 });</code></pre>"+
"<ul><li>Extract when behaviour repeats or a component's logic obscures its rendering — not to hit a &ldquo;hooks folder&rdquo; quota.</li><li>Design the return shape: tuple for pair-like (<code>[value, set]</code>), object for rich results; keep returned functions referentially stable if consumers will memo on them.</li><li>Test hooks directly with <code>renderHook</code> from Testing Library.</li></ul>"),
q("REA","A page re-renders constantly and feels sluggish. Walk through your actual debugging process.",
"<ol><li><strong>Measure first</strong>: React DevTools Profiler — record the interaction, look at flame graph: which components render, how often, and &ldquo;why did this render?&rdquo; (props/state/context changes highlighted).</li><li><strong>Usual suspects</strong>: a context value recreated every render (<code>value={{user, setUser}}</code> — memoise it); inline object/array/lambda props defeating <code>React.memo</code> children; state living too high (typing in a header search re-renders the whole page — push state down or lift content up via <code>children</code>); a subscription (store selector) returning new references each time.</li><li><strong>Fix in order of leverage</strong>: restructure state locality first, then memo boundaries around expensive subtrees, then <code>useMemo/useCallback</code> for identities feeding those boundaries. For 10k-row lists, none of that beats virtualization (react-window / TanStack Virtual).</li><li><strong>Confirm</strong> with the profiler again and an INP measurement — &ldquo;feels faster&rdquo; is not a metric.</li></ol>"+
"<p>Senior signal: renders aren't inherently bad — React re-rendering cheap components is fine; you're hunting <em>expensive</em> renders and <em>cascades</em>, not chasing a zero-render ideology.</p>"),
q("REA","CSR vs SSR/Next.js vs static — how do you choose a rendering strategy for a real product?",
"<ul><li><strong>CSR (SPA/Vite)</strong>: internal tools, dashboards, authenticated apps — SEO irrelevant, users tolerate one load, hosting is a CDN bucket. Simplest ops.</li><li><strong>SSG/ISR</strong>: marketing, docs, blogs, catalogs that change on publish — pre-rendered pages from a CDN are unbeatable for speed and cost; ISR revalidates without full rebuilds.</li><li><strong>SSR</strong>: pages needing fresh, per-request, SEO-visible data — search results, product pages with live stock/pricing, personalised landing pages.</li><li><strong>RSC (App Router)</strong>: server components fetch data with zero client bundle cost; client components only where interactivity lives — the emerging default for content-heavy apps, at the price of framework coupling and a real mental-model shift (server/client boundary discipline).</li></ul>"+
"<div class='callout'><b>Real world</b>Honest trade-off to say out loud: SSR adds servers, caching layers and deployment complexity — if your app sits behind a login and Google never sees it, a CSR SPA plus React Query is less machinery for the same UX. Choose per-surface: many products ship a static marketing site and a CSR app side by side.</div>");

/* ============ 20 ADDITIONAL QUESTIONS PER TOPIC ============ */
function qaPlus(topic, question, answer, example, diagram) {
  const esc = value => value.replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));
  q(topic, question,
    `<p>${esc(answer)}</p><div class="callout"><b>Real world</b>${esc(example)}</div>`,
    diagram || null);
}

[
["How do endpoint filters differ from middleware and action filters?","Middleware surrounds every matching request, action filters are controller-specific, and endpoint filters wrap individual Minimal API handlers. Choose the narrowest scope that owns the concern.","A pricing API used middleware for correlation IDs, an endpoint filter for request signature validation, and no controller dependency."],
["How would you design idempotent POST endpoints?","Accept an idempotency key, atomically reserve it with the request fingerprint, persist the response, and replay that response for identical retries. Reject reuse with a different body.","A payment client timed out after authorization; retrying with the same key returned the original charge instead of charging twice.","sequenceDiagram\nautonumber\nparticipant C as Client\nparticipant A as API\nparticipant D as Database\nC->>A: POST /payments + Idempotency-Key K1\nA->>D: Insert K1 and request hash\nD-->>A: Reserved\nA->>D: Commit payment and response atomically\nA-->>C: 201 Created\nC->>A: Retry K1\nA->>D: Read saved response\nA-->>C: Replay 201 Created"],
["When should an API return 200, 201, 202, 204, or 409?","Use 200 for successful representations, 201 plus Location for created resources, 202 for accepted asynchronous work, 204 for success without a body, and 409 for a state conflict the caller may resolve.","Bulk report generation returned 202 with an operation URL; duplicate customer email registration returned 409 with ProblemDetails."],
["How do you prevent over-posting and mass-assignment bugs?","Bind transport-specific request DTOs, validate allowed fields, and map explicitly into commands or entities. Never bind persistence entities directly from public JSON.","An attacker could not set IsAdmin because the registration DTO exposed only name, email, and password."],
["How do ETags and conditional requests prevent lost updates?","Return an ETag representing the resource version and require If-Match on mutation. A stale version receives 412 rather than overwriting newer data.","Two agents edited the same support ticket; the second stale save received 412 and prompted a merge."],
["How do you stream large responses without exhausting memory?","Use IAsyncEnumerable, response streaming, cancellation tokens, bounded buffers, and backpressure. Avoid materializing the full result or wrapping it in an object that forces buffering.","A CSV export streamed database pages directly to the response and held memory below 50 MB for a 6 GB export."],
["What is the correct way to handle file uploads?","Set strict size limits, validate magic bytes rather than trusting Content-Type, stream to quarantine storage, scan, generate server-side names, and keep files outside the web root.","A résumé service rejected a renamed executable even though its extension and MIME type claimed PDF."],
["How do you secure Swagger and OpenAPI in production?","Publish only intended operations, exclude internal schemas, require authentication or disable interactive UI, and never embed credentials. Contract publication and executable exploration are separate decisions.","A partner API exposed the JSON contract publicly but restricted Swagger UI and Try it out to support staff."],
["What is the strangler pattern for API migration?","Place a routing facade before the legacy API, move one capability at a time to the new implementation, preserve contracts, and measure traffic before removing old paths.","Customer reads moved to ASP.NET Core first while writes stayed on the legacy service until reconciliation proved parity."],
["How should correlation and trace context cross services?","Accept or create W3C traceparent, propagate it on outgoing calls and messages, add business correlation separately, and include trace IDs in ProblemDetails and logs.","One order ID linked browser, API, SQS consumer, and payment traces without treating the order ID as a trace identifier."],
["How do you implement graceful shutdown?","Stop accepting new work, mark readiness false, allow in-flight requests a bounded drain period, propagate cancellation, flush telemetry, and close resources.","During Kubernetes rollout, checkout requests completed within a 25-second drain instead of being reset."],
["When is gRPC preferable to REST?","Use gRPC for typed internal service calls, high throughput, streaming, and controlled clients. Prefer REST for browser reach, public APIs, cache semantics, and easier ad-hoc integration.","A telemetry service used bidirectional gRPC internally while exposing REST summaries to customers."],
["How do you version events independently from APIs?","Treat events as durable contracts: add optional fields, avoid semantic reuse, publish schema versions, support old consumers, and use upcasters when necessary.","OrderPlaced v2 added an optional channel field; consumers that knew only v1 continued processing."],
["What does a secure CORS policy look like?","Allow exact trusted origins, required methods and headers only, and credentials only when necessary. CORS is a browser control, not authentication.","Production accepted the customer SPA origin but rejected wildcard origins when cookies were enabled."],
["How do you test a Web API realistically?","Combine unit tests for domain rules, WebApplicationFactory integration tests for the full pipeline, database-container tests, contract tests, and a few end-to-end journeys.","An integration test caught authorization middleware being registered after endpoint mapping—something controller unit tests missed."],
["How should API pagination work at scale?","Prefer stable cursor or keyset pagination over OFFSET for large, changing sets. Order by a unique composite key and return an opaque continuation token.","An audit feed paged by createdAt plus id and avoided duplicate rows while new events arrived."],
["How do you expose long-running operations?","Return 202 with an operation resource, publish progress and terminal state, support cancellation, make execution idempotent, and expire old operation records.","A data import returned an operation ID polled by the UI and survived an API restart."],
["How do you protect expensive endpoints?","Combine authentication, per-tenant quotas, concurrency limits, bounded queues, timeouts, body limits, and cost-aware authorization.","A PDF endpoint allowed ten requests per minute but only two concurrent renders per tenant."],
["What is a Backend for Frontend?","A BFF is a client-specific API that aggregates and shapes downstream data, owns client authentication concerns, and avoids forcing generic services to mirror UI screens.","The mobile BFF returned compact checkout data while the web BFF included merchandising panels."],
["How do you deprecate an API safely?","Announce dates, emit Deprecation and Sunset headers, publish migration guidance, monitor callers, contact remaining owners, then block in stages.","A partner API used per-key dashboards and delayed shutdown until every active v1 caller had migrated."]
].forEach(x=>qaPlus("API",...x));

[
["Explain covariance and contravariance in C# generics.","Covariance allows a more derived output type through out; contravariance allows a less derived input type through in. Variance applies only to interfaces and delegates with reference types.","An IEnumerable<Dog> was consumed as IEnumerable<Animal>, while an IComparer<Animal> safely compared Dog instances."],
["What are nullable reference types really doing?","They are compile-time flow analysis and annotations, not runtime validation. Treat warnings as design feedback, validate external input, and avoid suppressing with the null-forgiving operator.","Enabling nullable found a production path where an optional customer address was dereferenced during invoicing."],
["How does garbage collection use generations and the LOH?","Short-lived objects begin in generation 0; survivors promote. Objects around 85 KB enter the large object heap, where allocation and compaction costs differ. Reduce retention before micro-optimizing allocation.","A report service retained multi-megabyte byte arrays in a singleton cache and caused long full-GC pauses."],
["When should you use ValueTask?","Use ValueTask only on hot paths that frequently complete synchronously and where measurement proves Task allocation matters. It has consumption constraints and adds API complexity.","A pooled socket reader returned synchronously for buffered data; ordinary business services stayed with Task."],
["How do CancellationTokenSource and linked tokens work?","Cancellation is cooperative. Link request, timeout, and shutdown tokens; pass the resulting token through every async boundary and distinguish cancellation from failure.","A report stopped when either the browser disconnected, the 30-second budget expired, or the host shut down."],
["What is the difference between lock, Monitor, SemaphoreSlim, and Mutex?","lock is process-local mutual exclusion; Monitor adds wait and pulse; SemaphoreSlim limits concurrency and supports async waiting; Mutex can coordinate across processes but is expensive.","An image pipeline used SemaphoreSlim to cap four decodes rather than serializing all work with lock."],
["How do immutable collections help concurrent systems?","They publish stable snapshots without readers observing mutation. Updates allocate changed structure, trading write cost for simpler thread safety and reasoning.","Routing rules were atomically swapped as an ImmutableDictionary while thousands of requests read lock-free."],
["What is the difference between delegates, events, and expressions?","Delegates are callable references, events restrict invocation to the declaring type, and expression trees describe code as data for translation or inspection.","EF translated an Expression<Func<Order,bool>> to SQL; domain events used event access restrictions."],
["Why are exceptions expensive and when should results replace them?","Throwing captures stack state and disrupts control flow. Use exceptions for exceptional failures; use typed results for expected validation or business outcomes.","Card decline returned a Declined result, while a broken payment transport raised an exception."],
["What are required members and init-only setters for?","They make construction requirements explicit while supporting object initializers and immutability after initialization. Runtime validation is still needed for external data.","A configuration record required BaseUrl and ApiKey at compile time and was immutable after startup."],
["How do pattern matching and discriminated-state modeling reduce bugs?","Closed hierarchies plus exhaustive switch expressions make states explicit and prevent invalid flag combinations.","Payment state became Pending, Authorized, Captured, or Failed records instead of three contradictory booleans."],
["What does ConfigureAwait do in modern .NET?","It controls synchronization-context capture. ASP.NET Core has no request context to capture, while reusable libraries may use false to avoid depending on callers' contexts.","A UI application resumed on its UI context; the shared network library used ConfigureAwait(false)."],
["How do Channels provide backpressure?","A bounded Channel makes producers wait or apply a declared full policy when consumers fall behind, preventing unbounded memory growth.","Email ingestion slowed at 500 queued jobs instead of accepting millions and crashing."],
["When should Parallel.ForEachAsync be used?","Use it for independent asynchronous work with a measured degree of parallelism. Do not use it to hide database N+1 queries or violate service rate limits.","A thumbnail job processed eight independent images concurrently while honoring cancellation."],
["What are source generators good for?","They move repetitive code generation to compile time, improving startup and avoiding reflection when the contract is stable.","System.Text.Json source generation reduced cold-start reflection in a serverless API."],
["What is the difference between reference equality and value equality?","Reference equality asks whether two variables point to the same object; value equality asks whether their represented values match. Records default to value semantics.","Two Money records compared equal despite separate allocations; two tracked Order entities retained identity semantics."],
["How do you design a correct IDisposable type?","Own only resources you create, make disposal idempotent, suppress finalization when applicable, and use SafeHandle for native handles. Prefer using declarations at ownership boundaries.","A stream wrapper left its injected stream open because it did not own the caller's resource."],
["What problem do generic math interfaces solve?","Static abstract interface members let algorithms operate over numeric capabilities without dynamic dispatch or duplicated overloads.","A statistics library computed averages for decimal, double, and custom fixed-point values through INumber<T>."],
["How do you diagnose ThreadPool starvation?","Observe queue length, worker availability, request latency, and blocking stacks. Remove sync-over-async and long blocking work before raising minimum threads.","Hundreds of .Result calls made CPU appear idle while requests queued; async propagation restored throughput."],
["What is defensive copying and when is it necessary?","Copy mutable input when callers must not mutate internal state after validation; expose read-only views without assuming they are immutable.","An order copied a supplied List<Line> so the caller could not add lines after total validation."]
].forEach(x=>qaPlus("CS",...x));

[
["What makes a composite index usable?","The leading columns must match common equality and range predicates; include columns can cover reads without widening the key. Validate with the actual plan.","An index on tenant_id, status, created_at served the tenant queue; reversing the order forced scans."],
["How do window functions differ from GROUP BY?","GROUP BY collapses rows; window functions calculate across a partition while retaining each row. They are ideal for ranks, running totals, and previous-value comparisons.","A ledger displayed every transaction with a running balance using SUM over account ordered by timestamp."],
["What is keyset pagination?","Seek from the last ordered key instead of skipping OFFSET rows. Use a deterministic unique ordering and encode the cursor opaquely.","A million-row activity feed stayed constant-time with WHERE created_at,id less than the cursor."],
["How should soft deletes be modeled?","Use a deletion timestamp, consistently filter active rows, preserve unique-key semantics, and define retention and purge. Soft delete is not a backup.","A customer email unique index applied only to active rows, allowing re-registration after retention expired."],
["What is a covering index?","It contains all columns needed for a query so the engine avoids base-table lookups. Cover selectively because wider indexes increase write and storage cost.","A dashboard query dropped random reads after including display_name and total in its narrow search index."],
["How do deadlocks happen and how are they handled?","Transactions acquire incompatible locks in different orders. Keep transactions short, access resources consistently, index predicates, and retry the chosen victim safely.","Two transfer paths locked accounts in opposite order; sorting account IDs removed the cycle."],
["What does sargable mean?","A predicate is sargable when the optimizer can use an index search. Functions or implicit conversion on indexed columns often force scans.","Replacing DATE(created_at)=date with a half-open timestamp range turned a scan into a seek."],
["When is denormalization justified?","Only after measured read cost warrants duplicated data and an explicit consistency mechanism exists.","An order read model stored customer display text and was updated by events; the transactional model remained normalized."],
["How do you perform zero-downtime schema changes?","Use expand-and-contract: add compatible schema, deploy dual-compatible code, backfill safely, switch reads, then remove old schema later.","A required column shipped nullable, was backfilled in batches, then received a constraint in a later release.","sequenceDiagram\nautonumber\nparticipant O as Old App\nparticipant DB as Database\nparticipant N as New App\nO->>DB: Read and write old column\nN->>DB: Deploy additive new column\nN->>DB: Dual write old and new\nN->>DB: Backfill in batches\nN->>DB: Switch reads to new\nO--xDB: Old version drained\nN->>DB: Later remove old column"],
["What are transaction isolation anomalies?","Dirty reads expose uncommitted data, non-repeatable reads change a row between reads, phantoms change a predicate set, and write skew violates a cross-row invariant.","Two doctors independently went off call under snapshot isolation; a constraint or serialized decision was needed."],
["How does optimistic concurrency work in SQL?","Update with the previously read version in the predicate and require one affected row. Zero rows means conflict, not success.","An inventory update used WHERE id and row_version, preventing a stale quantity overwrite."],
["What is the outbox pattern at database level?","Write business state and an unpublished event in the same transaction; a relay publishes later and marks progress. Consumers remain idempotent.","An order commit could not succeed without its OrderPlaced outbox row, eliminating the dual-write gap."],
["How should NULL be reasoned about?","NULL means unknown or absent and uses three-valued logic. Use IS NULL, define nullability deliberately, and understand how aggregates and unique constraints treat it.","A NOT IN query returned no rows because its subquery contained NULL; NOT EXISTS expressed the intent safely."],
["When are materialized views appropriate?","Use them for expensive, read-heavy derived data that tolerates refresh lag. Define refresh cadence, concurrency behavior, and ownership.","A daily finance dashboard refreshed aggregates every five minutes instead of joining billions of ledger rows."],
["How do you find duplicate rows safely?","First identify the business key with GROUP BY and HAVING, choose a survivor deterministically with ROW_NUMBER, repair references, then enforce uniqueness.","A cleanup kept the earliest customer record and added a unique normalized-email constraint afterward."],
["What is partitioning and what does it not solve?","Partitioning divides large tables for pruning and lifecycle operations. It does not replace useful indexes or automatically accelerate queries lacking the partition key.","Monthly event partitions allowed instant retention drops, but tenant searches still needed local indexes."],
["Why can SELECT star be harmful?","It transfers unused data, prevents covering indexes, couples consumers to schema order, and amplifies large-column costs.","A list endpoint fetched document blobs accidentally; explicit projection cut latency and memory dramatically."],
["How do statistics affect query plans?","Statistics estimate row distribution and cardinality; stale or insufficient statistics cause wrong joins and memory grants. Compare estimated with actual rows.","A highly skewed tenant produced a nested-loop disaster until filtered statistics captured its distribution."],
["What is a recursive CTE used for?","It traverses hierarchies or graphs with a seed and recursive member. Add depth or cycle protection and avoid it for unbounded graph workloads.","An organization chart expanded reports-to relationships while tracking depth and detecting malformed cycles."],
["How do prepared statements help and hurt?","They prevent injection when parameterized and can reuse plans, but one cached generic plan may perform poorly for skewed values.","A search query split common and whale tenants into separate shapes after one prepared plan failed both."]
].forEach(x=>qaPlus("SQL",...x));

[
["How does InnoDB MVCC provide consistent reads?","InnoDB reconstructs older row versions from undo logs according to the transaction snapshot. Long transactions retain history and delay purge.","A forgotten reporting transaction caused undo growth and degraded the primary despite doing no writes."],
["What is the clustered primary key implication in InnoDB?","Table rows are stored by primary key, and every secondary index stores that key. Prefer short, stable, increasing keys to reduce page splits and secondary-index bloat.","Replacing a wide random string primary key with a compact surrogate cut every secondary index materially."],
["How do you read EXPLAIN ANALYZE in MySQL 8?","Compare estimated and actual rows, loops, access type, chosen key, and timing at each iterator. Fix the first large estimation or work explosion.","A nested loop executed its inner lookup 400,000 times; a composite index reduced it to one selective range."],
["When should generated columns be indexed?","Use deterministic generated columns to index expressions the application queries repeatedly, especially normalized or extracted values.","A stored generated lower_email column supported case-insensitive login without wrapping the indexed source column."],
["What are invisible indexes for?","They let the optimizer ignore an index while keeping it maintained, enabling safe impact testing before removal.","A team made a suspected-unused index invisible for a week, monitored regressions, then dropped it."],
["How does replication lag affect reads?","Asynchronous replicas may not contain a just-committed write. Route read-your-write flows to primary or wait on a replication position.","Checkout confirmation read the primary while catalog browsing used replicas."],
["What is GTID-based replication?","Global transaction identifiers uniquely name committed transactions and simplify failover, topology changes, and consistency checks.","A replica was promoted without manually calculating binary-log filenames and offsets."],
["How do online DDL algorithms differ?","INSTANT changes metadata, INPLACE avoids a full table copy but may still rebuild, and COPY creates a new table. Lock clauses state tolerated blocking.","A supposedly online index build still saturated I/O, so it was throttled and scheduled despite LOCK=NONE."],
["What is the MySQL JSON trade-off?","JSON supports flexible attributes and generated-column indexing, but sacrifices relational constraints and easy cross-field querying. Stable core data belongs in columns.","Product-specific attributes stayed JSON; price, SKU, and inventory remained typed and constrained."],
