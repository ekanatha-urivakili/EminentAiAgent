<style>
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#131820; --muted:#5B6572;

  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;

html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent-ink)}

/* ---------- header ---------- */
.masthead{background:var(--ink);color:#F4F6FA;padding:26px 24px 22px;border-bottom:4px solid var(--accent)}
.masthead-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,3vw,2rem);letter-spacing:-.01em}
.brand h1 .tick{color:#9B7DF0}
.brand p{color:#9AA4B2;font-size:.85rem;margin-top:4px;font-family:var(--mono)}
.searchbox{display:flex;align-items:center;gap:8px;background:#232936;border:1px solid #39414F;border-radius:8px;padding:9px 12px;min-width:min(340px,100%)}
.searchbox input{flex:1;background:none;border:none;outline:none;color:#F4F6FA;font-family:var(--mono);font-size:.85rem}
.searchbox input::placeholder{color:#727C8A}
.searchbox .kbd{font-family:var(--mono);font-size:.68rem;color:#727C8A;border:1px solid #39414F;border-radius:4px;padding:1px 5px}

/* ---------- layout ---------- */
.shell{width:100%;max-width:1180px;min-width:0;margin:0 auto;padding:22px 24px 80px;display:grid;grid-template-columns:222px minmax(0,1fr);gap:26px;align-items:start}
.shell>*,main,.rail,.tabs,#content,#list{min-width:0;max-width:100%}
@media(max-width:860px){.shell{grid-template-columns:1fr;padding:14px 12px 60px}}

/* ---------- tab rail ---------- */
.rail{position:sticky;top:16px}
.rail-label{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 12px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;padding:9px 12px;border-radius:0 7px 7px 0;font-size:.86rem;font-weight:500;color:var(--muted)}
.tab .cnt{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted);background:var(--line);border-radius:10px;padding:1px 7px}
.tab:hover{background:#E8EBF0;color:var(--ink)}
.tab.active{border-left-color:var(--accent);background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(19,24,32,.06)}
.tab.active .cnt{background:var(--accent-soft);color:var(--accent-ink)}
@media(max-width:860px){
  .rail{position:static}
  .rail-label{display:none}
  .tabs{width:100%;max-width:100%;min-width:0;flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .tab{border-left:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap;padding:7px 13px;flex:0 0 auto}
  .tab{scroll-snap-align:start;min-height:42px}

  .topic-head{padding:0 6px;margin-bottom:10px}
  .card{border-radius:9px;margin-bottom:12px}
  .card-top{display:grid;grid-template-columns:auto 1fr;padding:13px 12px 0;gap:9px}
  .qtitle{font-size:1rem}
  .card-body{padding:10px 12px 4px}
  .card-body p,.card-body ul,.card-body ol{font-size:.9rem}
  .card-body pre{margin-inline:-4px;padding:11px;font-size:.74rem}
  .card-actions{display:grid;grid-template-columns:repeat(3,1fr);padding:9px 12px;gap:6px}
  .act{justify-content:center;padding:9px 6px;min-height:42px}
  .pager{position:sticky;bottom:0;background:rgba(242,244,247,.96);padding:8px 2px;z-index:10;backdrop-filter:blur(8px)}

<script>
const TOPICS=[
 {k:"API",label:".NET Core Web API"},
 {k:"CS",label:"C#"},
 {k:"SQL",label:"SQL"},
 {k:"MY",label:"MySQL"},
 {k:"PG",label:"PostgreSQL"},
 {k:"AWS",label:"AWS Cloud"},
 {k:"DP",label:"Design Patterns"},
 {k:"ARC",label:"Architecture"},
 {k:"SYS",label:"System Design"},
 {k:"SOL",label:"SOLID Principles"},
 {k:"REA",label:"React"}
];
const D=[];
function q(t,q,a,m){D.push({t,q,a,m:m||null});}

/* ============ .NET CORE WEB API ============ */
q("API","Explain the middleware pipeline. Why does order matter, and when would you write custom middleware?",
"<p>Every request flows through an ordered chain of middleware; each component can short-circuit or pass to the next. Order is behaviour: <code>UseAuthentication</code> must run before <code>UseAuthorization</code>, and exception handling must be registered first so it wraps everything downstream.</p>"+
"<pre><code>app.UseExceptionHandler(\"/error\");   // 1. outermost — catches everything\napp.UseHttpsRedirection();           // 2.\napp.UseRouting();                    // 3. selects endpoint\napp.UseAuthentication();             // 4. who are you?\napp.UseAuthorization();              // 5. what may you do?\napp.MapControllers();                // 6. terminal</code></pre>"+
"<div class='callout'><b>Real world</b>In a fintech API we wrote correlation-ID middleware that reads <code>X-Correlation-Id</code> (or generates one), pushes it into the logging scope, and echoes it back — placed immediately after exception handling so even failures are traceable across services.</div>"),
q("API","Minimal APIs vs Controllers — how do you choose on a real project?",
"<p>Minimal APIs cut ceremony and start faster (no controller activation, less reflection), which suits microservices, BFFs, and lambdas. Controllers still win when you need heavy filter pipelines, model-binding conventions across dozens of endpoints, or a large team that benefits from an enforced structure.</p>"+
"<ul><li><strong>Minimal:</strong> service with 5–30 endpoints, vertical-slice organisation, endpoint filters for cross-cutting concerns.</li><li><strong>Controllers:</strong> large monolith APIs, teams relying on <code>[ApiController]</code> conventions, generated clients from attribute metadata.</li></ul>"+
"<div class='callout'><b>Real world</b>We migrated an internal pricing service to minimal APIs grouped with <code>MapGroup(\"/prices\").RequireAuthorization()</code>; the public order API stayed on controllers because 40+ endpoints shared custom action filters for auditing.</div>"),
q("API","Explain DI lifetimes — Transient, Scoped, Singleton — and a production bug each can cause.",
"<p><strong>Transient</strong>: new instance per resolution. <strong>Scoped</strong>: one per HTTP request. <strong>Singleton</strong>: one for the app lifetime.</p>"+
"<ul><li><strong>Captive dependency</strong>: injecting a scoped <code>DbContext</code> into a singleton silently freezes one context forever — you get stale data and threading crashes under load. .NET throws in Development (scope validation) but not by default in Production.</li><li><strong>Transient <code>HttpClient</code></strong> created with <code>new</code> exhausts sockets (see IHttpClientFactory).</li><li><strong>Singleton with mutable state</strong> causes cross-request data bleed — one user sees another's cached basket.</li></ul>"+
"<pre><code>// Fix captive dependency inside a BackgroundService:\nusing var scope = _scopeFactory.CreateScope();\nvar db = scope.ServiceProvider.GetRequiredService&lt;AppDbContext&gt;();</code></pre>"),
q("API","Walk through JWT bearer authentication end-to-end in a Web API.",
"<p>The client authenticates once against an identity provider, receives a signed access token, and presents it on every call. The API never stores session state — it validates the signature, issuer, audience and expiry locally using the IdP's public keys (JWKS), so validation costs microseconds and scales horizontally.</p>"+
"<pre><code>builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n  .AddJwtBearer(o =&gt; {\n      o.Authority = \"https://login.mycorp.com\";   // fetches JWKS\n      o.TokenValidationParameters = new() {\n          ValidAudience = \"orders-api\",\n          ClockSkew = TimeSpan.FromSeconds(30)\n      };\n  });</code></pre>"+
"<div class='callout'><b>Real world</b>Keep access tokens short-lived (5–15 min) and rotate with refresh tokens; when we had a token leak incident, the 10-minute expiry limited the blast radius to minutes, not days.</div>",
"sequenceDiagram\nautonumber\nparticipant C as Client (SPA)\nparticipant IDP as Identity Provider\nparticipant API as Orders API\nC->>IDP: POST /token (credentials / auth code)\nIDP-->>C: access_token (JWT, 10 min) + refresh_token\nC->>API: GET /orders + Authorization Bearer token\nAPI->>API: Validate sig via cached JWKS + iss/aud/exp\nAPI-->>C: 200 OK (orders)\nC->>API: GET /orders (token expired)\nAPI-->>C: 401 Unauthorized\nC->>IDP: POST /token (refresh_token)\nIDP-->>C: new access_token\nC->>API: Retry with new token\nAPI-->>C: 200 OK"),
q("API","How do you implement consistent error handling and validation responses (ProblemDetails)?",
"<p>Return RFC 9457 <code>ProblemDetails</code> for every failure so clients parse one shape. Centralise with <code>IExceptionHandler</code> (.NET 8+) rather than try/catch in controllers, and let <code>[ApiController]</code> auto-return <code>ValidationProblemDetails</code> for model-state failures.</p>"+
"<pre><code>public class GlobalExceptionHandler : IExceptionHandler {\n  public async ValueTask&lt;bool&gt; TryHandleAsync(HttpContext ctx, Exception ex, CancellationToken ct) {\n    var (status, title) = ex switch {\n      NotFoundException      =&gt; (404, \"Resource not found\"),\n      DomainRuleException d  =&gt; (422, d.Message),\n      _                      =&gt; (500, \"Unexpected error\")\n    };\n    await Results.Problem(title: title, statusCode: status,\n        extensions: new Dictionary&lt;string,object?&gt;{[\"traceId\"]=ctx.TraceIdentifier})\n      .ExecuteAsync(ctx);\n    return true;\n  }\n}</code></pre>"+
"<p>Never leak stack traces in production responses; log them with the <code>traceId</code> instead so support can correlate.</p>"),
q("API","Compare API versioning strategies and describe one you shipped.",
"<ul><li><strong>URL segment</strong> (<code>/v2/orders</code>): explicit, cache-friendly, easiest for consumers — most common for public APIs.</li><li><strong>Header / media-type</strong> (<code>Accept: application/vnd.co.v2+json</code>): clean URLs, but invisible in logs and painful to test from a browser.</li><li><strong>Query string</strong> (<code>?api-version=2</code>): simple, but pollutes cache keys.</li></ul>"+
"<pre><code>services.AddApiVersioning(o =&gt; {\n  o.DefaultApiVersion = new ApiVersion(1);\n  o.AssumeDefaultVersionWhenUnspecified = true;\n  o.ReportApiVersions = true;   // api-supported-versions header\n});</code></pre>"+
"<div class='callout'><b>Real world</b>We ran v1 and v2 of a partner API side-by-side for 9 months, emitting a <code>Sunset</code> header and dashboarding v1 traffic per API key — you can only retire a version when you can name who is still calling it.</div>"),
q("API","How does built-in rate limiting work in ASP.NET Core, and which algorithm fits which scenario?",
"<p>.NET 7+ ships <code>Microsoft.AspNetCore.RateLimiting</code> with four algorithms: <strong>fixed window</strong> (simple quotas), <strong>sliding window</strong> (smooths the boundary-burst problem), <strong>token bucket</strong> (allows bursts, refills steadily — good for public APIs), and <strong>concurrency</strong> (caps simultaneous in-flight work — good for expensive endpoints like report generation).</p>"+
"<pre><code>builder.Services.AddRateLimiter(o =&gt; {\n  o.AddPolicy(\"per-key\", ctx =&gt;\n    RateLimitPartition.GetTokenBucketLimiter(\n      ctx.Request.Headers[\"X-Api-Key\"].ToString(),\n      _ =&gt; new() { TokenLimit = 100, TokensPerPeriod = 20,\n                   ReplenishmentPeriod = TimeSpan.FromSeconds(10) }));\n  o.RejectionStatusCode = 429;\n});</code></pre>"+
"<p>In multi-instance deployments this limiter is per-node; enforce global limits at the gateway (YARP, API Gateway, or Redis-backed).</p>"),
q("API","Why does IHttpClientFactory exist? What breaks without it?",
"<p><code>new HttpClient()</code> per request leaks sockets: disposed clients leave connections in <code>TIME_WAIT</code> and under load you hit <code>SocketException: address already in use</code>. A single static client fixes sockets but caches DNS forever — it never notices a failed-over endpoint.</p>"+
"<p><code>IHttpClientFactory</code> pools and rotates <code>HttpMessageHandler</code> instances (default 2-minute lifetime), solving both, and lets you compose named/typed clients with Polly resilience:</p>"+
"<pre><code>builder.Services.AddHttpClient&lt;PaymentsClient&gt;(c =&gt;\n    c.BaseAddress = new Uri(\"https://payments.internal\"))\n  .AddStandardResilienceHandler();   // retry + circuit breaker + timeout (.NET 8)</code></pre>"+
"<div class='callout'><b>Real world</b>A nightly job creating a client per record took production down at 2 a.m. via port exhaustion on the box — the fix was one typed client injected once.</div>"),
q("API","Response caching vs Output caching vs distributed cache — where does each belong?",
"<ul><li><strong>ResponseCaching</strong> honours HTTP <code>Cache-Control</code> headers — it mainly instructs proxies/CDNs; it ignores authenticated requests.</li><li><strong>OutputCaching</strong> (.NET 7+) is server-side, policy-driven, supports tag-based invalidation, and works for authorised endpoints.</li><li><strong>IDistributedCache / HybridCache</strong> caches data, not responses — use inside services when multiple endpoints share the same expensive lookup.</li></ul>"+
"<pre><code>app.MapGet(\"/catalog\", GetCatalog)\n   .CacheOutput(p =&gt; p.Expire(TimeSpan.FromMinutes(5)).Tag(\"catalog\"));\n\n// after an admin updates products:\nawait cacheStore.EvictByTagAsync(\"catalog\", ct);</code></pre>"+
"<p>Rule of thumb: cache at the edge what is public, cache output for shaped responses, cache data for shared computation — and always design the invalidation before the cache.</p>"),
q("API","How do health checks integrate with orchestrators? Liveness vs readiness in practice.",
"<p><strong>Liveness</strong> answers &ldquo;is the process alive?&rdquo; — if it fails, Kubernetes restarts the pod. <strong>Readiness</strong> answers &ldquo;can it serve traffic?&rdquo; — if it fails, the pod is removed from the load balancer but not killed. Conflating them causes restart storms: a database blip fails a liveness probe and Kubernetes kills perfectly healthy pods.</p>"+
"<pre><code>builder.Services.AddHealthChecks()\n  .AddCheck(\"self\", () =&gt; HealthCheckResult.Healthy(), tags: [\"live\"])\n  .AddNpgSql(connString, tags: [\"ready\"])\n  .AddCheck&lt;QueueDepthCheck&gt;(\"queue\", tags: [\"ready\"]);\n\napp.MapHealthChecks(\"/health/live\",  new() { Predicate = r =&gt; r.Tags.Contains(\"live\") });\napp.MapHealthChecks(\"/health/ready\", new() { Predicate = r =&gt; r.Tags.Contains(\"ready\") });</code></pre>"+
"<p>Keep liveness dependency-free. Readiness may check the database, cache and message broker — the things without which serving a request is pointless.</p>");

/* ============ C# ============ */
q("CS","What actually happens when you await? Explain the state machine and a classic deadlock.",
"<p>The compiler rewrites an <code>async</code> method into a state machine. At <code>await</code>, if the task isn't complete, the method returns to its caller and registers a continuation; the thread goes back to the pool — nothing blocks. When the task completes, the continuation resumes on the captured context (UI thread, or none in ASP.NET Core).</p>"+
"<p>The classic deadlock: legacy ASP.NET / UI code calls <code>.Result</code> on an async method. The sync call blocks the context's only thread; the continuation needs that same thread to resume — permanent standoff.</p>"+
"<pre><code>// Deadlocks in a WinForms handler:\nvar data = GetDataAsync().Result;   // blocks UI thread\nasync Task&lt;string&gt; GetDataAsync() {\n    await Task.Delay(100);          // continuation wants UI thread\n    return \"x\";\n}</code></pre>"+
"<p>Fixes: async all the way up; <code>ConfigureAwait(false)</code> in library code; never <code>.Result</code>/<code>.Wait()</code> on the request path. ASP.NET Core has no synchronization context, so the deadlock disappears — but sync-over-async still burns thread-pool threads and collapses throughput under load.</p>"),
q("CS","IEnumerable&lt;T&gt; vs IQueryable&lt;T&gt; — why does the wrong one destroy performance?",
"<p><code>IQueryable</code> builds an expression tree that a provider (EF Core) translates to SQL — filtering happens in the database. <code>IEnumerable</code> executes in memory — the moment you cast to it, everything after runs client-side.</p>"+
"<pre><code>// BAD: pulls the whole Orders table, filters in app memory\nIEnumerable&lt;Order&gt; orders = db.Orders;\nvar recent = orders.Where(o =&gt; o.Created &gt; cutoff).Take(20).ToList();\n\n// GOOD: translates to SELECT ... WHERE ... LIMIT 20\nvar recent = await db.Orders\n    .Where(o =&gt; o.Created &gt; cutoff)\n    .OrderByDescending(o =&gt; o.Created)\n    .Take(20).ToListAsync();</code></pre>"+
"<div class='callout'><b>Real world</b>A repository returning <code>IEnumerable</code> from EF hid this: a dashboard query &ldquo;worked&rdquo; in dev with 500 rows and shipped a table-scan-into-RAM against 40 million rows in production. Watch also for deferred execution: enumerating the same query twice hits the database twice.</div>"),
q("CS","record vs class vs struct — decision criteria with real examples.",
"<ul><li><strong>class</strong>: reference type, identity matters, mutable domain entities (<code>Order</code> whose state transitions).</li><li><strong>record</strong>: reference type with value equality, <code>with</code>-expressions, immutability by default — DTOs, commands, events, config snapshots.</li><li><strong>struct / readonly record struct</strong>: value type, no heap allocation — tiny, immutable, high-volume values (<code>Money</code>, coordinates, IDs). Keep under ~16–24 bytes or copying costs outweigh allocation savings.</li></ul>"+
"<pre><code>public sealed record CreateOrderCommand(Guid CustomerId, IReadOnlyList&lt;LineItem&gt; Items);\npublic readonly record struct Money(decimal Amount, string Currency)\n{\n    public static Money operator +(Money a, Money b) =&gt;\n        a.Currency == b.Currency ? new(a.Amount + b.Amount, a.Currency)\n                                 : throw new CurrencyMismatchException();\n}</code></pre>"+
"<p>Value equality on records also makes tests and caching keys trivial — two <code>CreateOrderCommand</code>s with the same data are equal without custom <code>Equals</code>.</p>"),
q("CS","What problems do Span&lt;T&gt; and Memory&lt;T&gt; solve? When have you used them?",
"<p><code>Span&lt;T&gt;</code> is a stack-only view over contiguous memory (array, stackalloc, native) that lets you slice and parse without allocating substrings or copies. <code>Memory&lt;T&gt;</code> is the heap-friendly counterpart you can store in fields and use across <code>await</code>.</p>"+
"<pre><code>// Parse \"GBP:1250.50\" without a single allocation:\nReadOnlySpan&lt;char&gt; s = line;\nint i = s.IndexOf(':');\nvar currency = s[..i];                 // slice, no substring\nvar amount = decimal.Parse(s[(i+1)..]);</code></pre>"+
"<div class='callout'><b>Real world</b>In a file-ingest pipeline processing 2 GB CSV exports, switching from <code>string.Split</code> to span slicing cut allocations ~90% and halved run time — the GC simply stopped being the bottleneck. Reach for spans in hot paths proven by a profiler, not by default.</div>"),
q("CS","Nullable reference types — what do they guarantee, and what do they not?",
"<p>NRTs (<code>#nullable enable</code>) are compile-time flow analysis: the compiler warns when a possibly-null value is dereferenced or assigned to a non-nullable target. They are <em>annotations, not runtime checks</em> — deserialisers, EF, reflection and older libraries can still hand you null in a &ldquo;non-nullable&rdquo; property.</p>"+
"<pre><code>public sealed class CustomerDto\n{\n    public required string Email { get; init; }   // 'required' forces initialisation\n    public string? Nickname { get; init; }         // explicitly optional\n}</code></pre>"+
"<ul><li>Validate at trust boundaries (API input, DB reads) — NRT does not replace validation.</li><li>Treat <code>!</code> (null-forgiving) as a code smell to justify in review.</li><li>Turn on <code>&lt;WarningsAsErrors&gt;nullable&lt;/WarningsAsErrors&gt;</code> so annotations stay honest.</li></ul>"),
q("CS","How would you build a producer/consumer pipeline today? Channels vs BlockingCollection.",
"<p><code>System.Threading.Channels</code> is the modern answer: fully async (no blocked threads), bounded with backpressure policies, and integrates with <code>IAsyncEnumerable</code>. <code>BlockingCollection</code> blocks threads — fine in old console apps, wasteful in servers.</p>"+
"<pre><code>var channel = Channel.CreateBounded&lt;EmailJob&gt;(new BoundedChannelOptions(500) {\n    FullMode = BoundedChannelFullMode.Wait     // backpressure, not OOM\n});\n\n// Producer (API endpoint)\nawait channel.Writer.WriteAsync(job, ct);\n\n// Consumer (BackgroundService)\nawait foreach (var job in channel.Reader.ReadAllAsync(ct))\n    await _sender.SendAsync(job, ct);</code></pre>"+
"<div class='callout'><b>Real world</b>We used a bounded channel between a webhook receiver and an SMS dispatcher: bursts of 10k webhooks queue in-process, the writer awaits when full, and the caller sees 202 Accepted instead of timeouts. Unbounded channels are how you rediscover OutOfMemoryException.</div>"),
q("CS","Explain GC generations and the Large Object Heap. How does this change how you write server code?",
"<p>Gen 0/1 collect fast and often; Gen 2 is expensive and pauses more. Objects &ge; 85 KB land on the <strong>LOH</strong>, collected only with Gen 2 and (by default) not compacted — repeated large allocations fragment it.</p>"+
"<p>Practical consequences:</p>"+
"<ul><li>Rent big buffers from <code>ArrayPool&lt;byte&gt;.Shared</code> instead of allocating per request.</li><li>Stream large payloads (<code>Stream</code>, <code>PipeReader</code>) rather than <code>ReadToEnd</code> into a giant string.</li><li>Avoid mid-life objects: things that survive to Gen 2 and then die are the worst case (e.g., per-request caches with sliding expirations).</li><li>Use Server GC for ASP.NET workloads (default) and verify with <code>dotnet-counters</code>: gen-2 GC count and % time in GC.</li></ul>"+
"<div class='callout'><b>Real world</b>An API serialising 5 MB reports per request showed sawtooth latency; pooling the buffer and streaming the response removed LOH churn and P99 dropped from 1.8 s to 300 ms.</div>"),
q("CS","Show pattern matching that genuinely improves production code, not toy switches.",
"<p>Pattern matching shines when it collapses branchy mapping logic into one declarative, exhaustive expression the compiler helps verify.</p>"+
"<pre><code>public static decimal ShippingFee(Order o) =&gt; o switch\n{\n    { Items.Count: 0 }                        =&gt; throw new EmptyOrderException(),\n    { Total: &gt; 100m }                          =&gt; 0m,\n    { Destination.Country: \"GB\", Weight: &lt; 2 } =&gt; 3.50m,\n    { Destination.Country: \"GB\" }              =&gt; 6.00m,\n    { Destination.IsEU: true }                 =&gt; 12.00m,\n    _                                          =&gt; 25.00m\n};\n\n// Type + property patterns replace if/else casting chains:\nvar label = payment switch {\n    CardPayment { Network: \"AMEX\" } =&gt; \"Amex surcharge applies\",\n    CardPayment                     =&gt; \"Card\",\n    BankTransfer { Instant: true }  =&gt; \"Faster Payments\",\n    _                               =&gt; \"Other\"\n};</code></pre>"+
"<p>Pair with sealed hierarchies (or discriminated-union-style records) so the compiler warns on unhandled cases when someone adds a new payment type.</p>"),
q("CS","IDisposable vs IAsyncDisposable — patterns, pitfalls, and finalizers.",
"<ul><li>Implement <code>IDisposable</code> when you own unmanaged resources <em>or</em> other disposables. Use <code>await using</code> / <code>IAsyncDisposable</code> when cleanup does I/O (flushing streams, closing DB connections gracefully).</li><li>Finalizers are almost never needed in application code — <code>SafeHandle</code> covers native handles. A finalizer promotes objects a GC generation and delays reclamation.</li><li>Dispose must be idempotent; double-dispose happens in real error paths.</li></ul>"+
"<pre><code>public sealed class ExportSession : IAsyncDisposable\n{\n    private readonly FileStream _fs;\n    public async ValueTask DisposeAsync()\n    {\n        await _fs.FlushAsync();     // async work — impossible in Dispose()\n        await _fs.DisposeAsync();\n    }\n}\nawait using var session = new ExportSession(path);</code></pre>"+
"<p>In DI, the container disposes what it created at scope end — don't dispose injected services yourself; do register factories for things needing deterministic lifetime inside a request.</p>"),
q("CS","Delegates, events, Func/Action — when do they beat an interface?",
"<p>An interface models a capability with potentially many members and a mockable identity; a delegate models a single operation as data. Prefer delegates when the contract is one method and you want composition without ceremony.</p>"+
"<pre><code>// Strategy without a class explosion:\npublic sealed class Retry(Func&lt;int, TimeSpan&gt; backoff)\n{\n    public TimeSpan DelayFor(int attempt) =&gt; backoff(attempt);\n}\nvar r = new Retry(a =&gt; TimeSpan.FromSeconds(Math.Pow(2, a)));</code></pre>"+
"<ul><li><strong>Events</strong> are multicast delegates with restricted access (only the owner raises) — right for in-process notification (e.g., cache invalidated), wrong for cross-service workflows (use messaging).</li><li>Beware captured closures in long-lived delegates: an event handler capturing <code>this</code> on a subscriber that never unsubscribes is the classic managed memory leak.</li><li>For testability, a <code>Func&lt;DateTime&gt;</code> clock or a <code>TimeProvider</code> beats a one-method <code>IClock</code> interface.</li></ul>");

/* ============ SQL ============ */
q("SQL","Clustered vs non-clustered indexes — how does the choice shape query performance?",
"<p>A <strong>clustered index</strong> defines the physical order of the table; there can be only one, and every non-clustered index stores the clustering key as its row locator. A <strong>non-clustered index</strong> is a separate B-tree pointing back to the row.</p>"+
"<ul><li>Wide clustering keys (GUIDs) bloat <em>every</em> secondary index and cause page splits on random inserts — a sequential key (identity, <code>NEWSEQUENTIALID</code>, ULID) keeps inserts appending.</li><li>Range queries on the clustering key (<code>WHERE CreatedAt BETWEEN ...</code>) read contiguous pages — dramatically cheaper.</li><li>A non-clustered index that doesn't cover the query pays a <strong>key lookup</strong> per row; thousands of lookups often make the optimizer abandon the index and scan.</li></ul>"+
"<div class='callout'><b>Real world</b>Changing an orders table PK from random <code>uniqueidentifier</code> to <code>bigint identity</code> (GUID kept as an alternate key) cut index size 40% and removed nightly page-split latency spikes.</div>"),
q("SQL","How do you read an execution plan? Seek vs scan, and what do you check first?",
"<p>Read right-to-left, thickest arrows first. My checklist:</p>"+
"<ol><li><strong>Estimated vs actual rows</strong> — a 100&times; mismatch means stale statistics or a non-SARGable predicate, and every downstream choice (join type, memory grant) is wrong.</li><li><strong>Scan vs seek</strong> — a scan on a huge table under a selective filter usually means a missing index or a predicate like <code>WHERE YEAR(Created)=2026</code> that kills seekability.</li><li><strong>Key lookups</strong> in bulk — add INCLUDE columns.</li><li><strong>Spills</strong> (sort/hash warnings) — memory misestimates writing to tempdb.</li></ol>"+
"<pre><code>-- Non-SARGable → scan          -- SARGable → seek\nWHERE YEAR(CreatedAt) = 2026    WHERE CreatedAt &gt;= '2026-01-01'\n                                  AND CreatedAt &lt;  '2027-01-01'</code></pre>"),
q("SQL","Explain transaction isolation levels via the anomalies they prevent. Which do you run in production?",
"<ul><li><strong>Read Uncommitted</strong>: dirty reads — you can see rolled-back money. Almost never acceptable.</li><li><strong>Read Committed</strong>: no dirty reads; non-repeatable reads and phantoms possible. The usual default.</li><li><strong>Repeatable Read</strong>: rows you read can't change under you; phantoms (new rows) still possible.</li><li><strong>Serializable</strong>: full correctness, range locks, real deadlock/throughput cost.</li><li><strong>Snapshot / RCSI</strong>: readers see a consistent version, writers don't block readers — reporting queries stop stalling OLTP.</li></ul>"+
"<div class='callout'><b>Real world</b>Default: Read Committed (with RCSI on SQL Server). Escalate per-transaction only where the invariant demands it — e.g., Serializable around &ldquo;check seat availability then book&rdquo; — and keep that transaction tiny. Blanket NOLOCK sprinkled by hint is a bug generator: it can read the same row twice or skip rows during page splits.</div>"),
q("SQL","What is the N+1 query problem? Show how it appears with an ORM and three fixes.",
"<p>One query loads N parents, then a lazy-loaded navigation fires one query per parent — 1+N round trips. It's invisible at dev data sizes and lethal at production sizes.</p>"+
"<pre><code>// EF Core: 1 query + 200 queries\nvar orders = await db.Orders.Take(200).ToListAsync();\nforeach (var o in orders)\n    total += o.Customer.CreditLimit;      // lazy load per order!</code></pre>"+
"<p>Fixes, in order of preference:</p>"+
"<ol><li><strong>Project</strong> exactly what you need: <code>.Select(o =&gt; new { o.Id, o.Customer.CreditLimit })</code> — one joined query, no entities tracked.</li><li><strong>Eager load</strong>: <code>.Include(o =&gt; o.Customer)</code> when you truly need full entities; use <code>AsSplitQuery()</code> if multiple collection includes create a row-explosion cartesian product.</li><li><strong>Batch</strong>: load parents, then one <code>WHERE CustomerId IN (...)</code> for children and stitch in memory.</li></ol>"+
"<p>Guardrail: log EF query counts per request in staging and alert when a request exceeds ~10.</p>"),
q("SQL","Window functions — give a real reporting problem they solve cleanly.",
"<p>Window functions compute across related rows <em>without collapsing them</em>, killing whole classes of self-joins and correlated subqueries.</p>"+
"<pre><code>-- Latest invoice per customer (top-N per group)\nSELECT * FROM (\n  SELECT i.*,\n         ROW_NUMBER() OVER (PARTITION BY CustomerId\n                            ORDER BY IssuedAt DESC) AS rn\n  FROM Invoices i\n) t WHERE rn = 1;\n\n-- Running balance per account\nSELECT AccountId, PostedAt, Amount,\n       SUM(Amount) OVER (PARTITION BY AccountId\n                         ORDER BY PostedAt\n                         ROWS UNBOUNDED PRECEDING) AS RunningBalance\nFROM Ledger;</code></pre>"+
"<ul><li><code>ROW_NUMBER / RANK / DENSE_RANK</code> — dedupe and top-N per group.</li><li><code>LAG / LEAD</code> — month-over-month deltas without self-joins.</li><li><code>SUM/AVG OVER</code> — running totals, moving averages.</li></ul>"+
"<p>They still sort/partition — index the <code>PARTITION BY, ORDER BY</code> columns for big sets.</p>"),
q("SQL","CTEs vs temp tables vs table variables — how do you choose?",
"<ul><li><strong>CTE</strong>: readability and recursion. It's an inlined expression, not materialised (SQL Server) — referencing it three times may execute it three times.</li><li><strong>Temp table (#t)</strong>: materialised in tempdb <em>with statistics</em> and indexable — the right tool when an intermediate result is large, reused, or the optimizer misestimates a complex step. Breaking a 400-line query into staged temp tables is a legitimate optimisation.</li><li><strong>Table variable (@t)</strong>: minimal logging, but historically poor cardinality estimates (fixed guess of 1 pre-2019) — fine for a handful of rows (e.g., passing IDs), dangerous for thousands.</li></ul>"+
"<div class='callout'><b>Real world</b>A reporting proc joining a 12-way CTE chain ran 14 minutes; materialising the two heavy intermediate sets into indexed temp tables gave the optimizer real row counts and dropped it to 40 seconds.</div>"),
q("SQL","A production deadlock is recurring nightly. How do you diagnose and fix it?",
"<p>Deadlock = two transactions holding locks the other needs, in opposite order. Diagnosis: capture the <strong>deadlock graph</strong> (SQL Server <code>system_health</code> XEvents; MySQL <code>SHOW ENGINE INNODB STATUS</code>; Postgres logs) — it names both statements and the resources.</p>"+
"<p>Fix hierarchy:</p>"+
"<ol><li><strong>Consistent lock ordering</strong> — every code path touches tables/rows in the same order (e.g., always <code>Accounts</code> then <code>Ledger</code>, ordered by account ID).</li><li><strong>Shorter transactions</strong> — no external API calls inside a transaction; do reads before <code>BEGIN</code> where possible.</li><li><strong>Better indexes</strong> — a missing index makes an UPDATE scan and lock far more rows than intended.</li><li><strong>Retry as a last line</strong> — deadlock victims (1205) are safe to retry idempotent transactions with jittered backoff.</li></ol>"+
"<div class='callout'><b>Real world</b>Our nightly case: a batch job updating balances ascending by AccountId collided with a payment API updating pairs (debit then credit) in arbitrary order. Sorting the pair by AccountId before locking eliminated it entirely.</div>"),
q("SQL","What is a covering index, and how do INCLUDE columns change the design?",
"<p>An index <em>covers</em> a query when every referenced column lives in the index — the engine never touches the base table, eliminating key lookups.</p>"+
"<pre><code>-- Query:\nSELECT OrderId, Total FROM Orders\nWHERE CustomerId = @id AND Status = 'Open'\nORDER BY CreatedAt DESC;\n\n-- Covering index: keys for seek+sort, INCLUDE for payload\nCREATE INDEX IX_Orders_Customer_Status\n  ON Orders (CustomerId, Status, CreatedAt DESC)\n  INCLUDE (Total);</code></pre>"+
"<ul><li>Key columns support seeking and ordering; INCLUDE columns are leaf-level payload only — cheaper to maintain and don't count against key-size limits.</li><li>Order equality columns first, then range/sort columns.</li><li>Every index taxes writes and storage — consolidate: one index with an INCLUDE often replaces three overlapping ones. Review usage stats before adding a fourth index to a hot table.</li></ul>"),
q("SQL","Explain parameter sniffing. When is it good, and how do you handle the bad case?",
"<p>On first compile, the engine builds the plan using the <em>actual</em> parameter values — usually good, because real values beat guesses. It bites when data is skewed: a plan compiled for <code>CustomerId = tiny-customer</code> (nested loops, 3 rows) is reused for a customer with 4 million rows and runs for minutes.</p>"+
"<p>Symptoms: the same proc is fast, then suddenly slow after a restart/recompile; performance depends on &ldquo;who ran it first&rdquo;.</p>"+
"<p>Options, by preference:</p>"+
"<ol><li>Fix the skew's root: better indexing so both extremes share a good plan.</li><li><code>OPTION (RECOMPILE)</code> on the one statement with wild variance — pay compile cost, get per-value plans.</li><li><code>OPTIMIZE FOR</code> a representative value, or branch: separate code paths for known whales.</li><li>SQL Server 2022+ Parameter Sensitive Plan optimization keeps multiple plans per proc automatically.</li></ol>"),
q("SQL","Normalization vs denormalization — where do you draw the line in a transactional system?",
"<p>Normalise (3NF) the write model by default: one fact in one place means updates can't disagree with themselves. Denormalise deliberately, for measured read problems, with a plan for keeping the copy consistent.</p>"+
"<p>Legitimate denormalisations I've shipped:</p>"+
"<ul><li><strong>Snapshot columns</strong>: <code>Orders.CustomerName</code>, unit price at time of sale — these are historical facts, not duplication; they <em>should not</em> change when the customer renames.</li><li><strong>Maintained aggregates</strong>: <code>Account.Balance</code> updated in the same transaction as the ledger row (or via triggers/outbox), because SUM over 50M rows per request is not viable.</li><li><strong>Read models</strong>: a flattened reporting table fed by events/ETL — full CQRS-lite, where the source of truth stays normalised.</li></ul>"+
"<p>The line: never denormalise mutable business state without a single owner and a defined propagation mechanism. &ldquo;We update it in both places in code&rdquo; is a data-corruption roadmap.</p>");

/* ============ MYSQL ============ */
q("MY","InnoDB vs MyISAM — why is InnoDB the only serious choice today?",
"<p>InnoDB gives ACID transactions, row-level locking, MVCC, crash recovery via redo/undo logs, and foreign keys. MyISAM offers none of that: table-level locks (one writer blocks all readers), no transactions, and table repair after crashes.</p>"+
"<ul><li>InnoDB clusters data by primary key — PK design directly shapes I/O (prefer compact, monotonic keys).</li><li>Since MySQL 8.0, system tables are InnoDB and MyISAM is effectively legacy; even its old niches (COUNT(*) speed, full-text) are matched or beaten.</li></ul>"+
"<div class='callout'><b>Real world</b>Inherited a reporting DB on MyISAM: every nightly bulk insert locked the tables analysts were querying. Migrating to InnoDB (plus RR isolation) removed the contention without touching application code — <code>ALTER TABLE ... ENGINE=InnoDB</code> table by table during low traffic.</div>"),
q("MY","Design a read-scaling setup with MySQL replication. What consistency trap must the application handle?",
"<p>Standard pattern: one primary for writes, N replicas for reads via async (or semi-sync) replication using row-based binlogs, with a proxy or driver routing reads.</p>"+
"<p>The trap is <strong>replication lag</strong> — read-your-own-writes violations. A user updates their profile (primary), the next GET hits a replica 300 ms behind, and their change &ldquo;disappears&rdquo;.</p>"+
"<ul><li>Pin a session to the primary for N seconds after a write (sticky reads).</li><li>Or wait on GTID: <code>WAIT_FOR_EXECUTED_GTID_SET</code> before reading from the replica.</li><li>Or route by intent: critical read-after-write paths always hit primary; feeds/search hit replicas.</li></ul>"+
"<p>Semi-sync replication ensures at least one replica acknowledged the transaction — you trade a little write latency for no data loss on primary failure.</p>",
"sequenceDiagram\nautonumber\nparticipant App as App Server\nparticipant P as MySQL Primary\nparticipant R as Read Replica\nApp->>P: UPDATE profile SET name='Eka' (write)\nP->>P: Commit + write binlog (GTID 4711)\nP-->>R: Stream binlog (async)\nApp->>R: SELECT profile  (100 ms later)\nR-->>App: STALE row (GTID 4711 not applied yet)\nNote over App,R: Fix: read-your-writes strategy\nApp->>R: SELECT WAIT_FOR_EXECUTED_GTID_SET('...4711', 1)\nR->>R: Apply binlog up to 4711\nR-->>App: Fresh row"),
q("MY","How do you use EXPLAIN in MySQL? Which columns and access types do you look at?",
"<p>Use <code>EXPLAIN ANALYZE</code> (8.0.18+) to get actual timings, not just the plan. Read the classic output by:</p>"+
"<ul><li><strong>type</strong> (access method), best&rarr;worst: <code>const</code>, <code>eq_ref</code>, <code>ref</code>, <code>range</code>, <code>index</code>, <code>ALL</code>. <code>ALL</code> on a large table under a filter = missing/unusable index.</li><li><strong>key / key_len</strong>: which index and how much of the composite key is actually used — a short <code>key_len</code> reveals the leftmost-prefix rule biting you.</li><li><strong>rows &times; filtered</strong>: estimated work; huge rows with tiny filtered % means the index isn't selective for this predicate.</li><li><strong>Extra</strong>: <code>Using filesort</code> / <code>Using temporary</code> flag sort/group not satisfied by an index — often fixable by matching index order to <code>ORDER BY</code>.</li></ul>"+
"<pre><code>EXPLAIN ANALYZE\nSELECT id, total FROM orders\nWHERE customer_id = 42 AND status = 'OPEN'\nORDER BY created_at DESC LIMIT 20;\n-- Want: type=ref, key=idx_cust_status_created, no filesort</code></pre>"),
q("MY","Which InnoDB settings matter most for a dedicated database server?",
"<ul><li><strong><code>innodb_buffer_pool_size</code></strong> — the single biggest lever: ~70–75% of RAM on a dedicated box. If the working set fits, reads become memory ops. Watch <code>Innodb_buffer_pool_reads</code> (disk) vs <code>read_requests</code> (total): hit rate should be &gt;99%.</li><li><strong><code>innodb_flush_log_at_trx_commit</code></strong> — 1 = fsync per commit (full durability); 2 = fsync per second (lose &le;1 s on OS crash). We ran 2 on ingestion clusters where the source could replay, 1 on money.</li><li><strong><code>innodb_log_file_size / redo capacity</code></strong> — too small causes aggressive checkpoint flushing under write bursts.</li><li><strong><code>max_connections</code></strong> is not a throughput dial — thousands of connections thrash; pool in the app (or ProxySQL) and keep active connections near core count.</li></ul>"+
"<div class='callout'><b>Real world</b>A &ldquo;slow database&rdquo; ticket ended with buffer pool at the 128 MB default on a 64 GB box — one config line and the P95 fell 10&times;. Always check the basics before redesigning schemas.</div>"),
q("MY","Explain gap locks and next-key locks. When have they caused you problems?",
"<p>Under REPEATABLE READ, InnoDB locks not just rows but the <em>gaps between index records</em> (gap locks) and row+gap (next-key locks) to prevent phantoms. Consequence: a <code>SELECT ... FOR UPDATE</code> or UPDATE on a range can block <em>inserts</em> into that range by other sessions — surprising deadlocks with no obvious shared rows.</p>"+
"<pre><code>-- Session A                        -- Session B\nUPDATE bookings SET x=1            INSERT INTO bookings(slot_id, ...)\nWHERE slot_id BETWEEN 10 AND 20;   VALUES (15, ...);   -- BLOCKED by gap lock</code></pre>"+
"<ul><li>Predicates on unindexed columns lock far more than expected (scan = lock everything scanned). Index your WHERE clauses.</li><li>READ COMMITTED disables most gap locking — many high-concurrency systems run RC deliberately for this reason.</li><li>Insert-heavy tables with range-updating jobs are the classic collision; schedule apart or narrow the ranges.</li></ul>"),
q("MY","When does table partitioning help in MySQL, and when is it a false hope?",
"<p>Partitioning splits one logical table into physical segments (typically <code>RANGE</code> on a date). Real wins:</p>"+
"<ul><li><strong>Data lifecycle</strong>: <code>ALTER TABLE ... DROP PARTITION</code> deletes a month of data in milliseconds vs a multi-hour DELETE that bloats undo and replicates row-by-row.</li><li><strong>Partition pruning</strong>: queries filtered by the partition key scan only relevant partitions.</li></ul>"+
"<p>False hopes:</p>"+
"<ul><li>It rarely speeds up point lookups a good index wouldn't — an index seek doesn't care the table is big.</li><li>Every unique key must include the partition column — often forcing awkward composite PKs.</li><li>Queries <em>not</em> filtering on the partition key touch all partitions and can get slower.</li></ul>"+
"<div class='callout'><b>Real world</b>We partitioned an audit-events table by month purely for retention: dropping partition <code>p2024_06</code> replaced a 3-hour delete job that used to lag every replica.</div>"),
q("MY","How would you implement search over product text in MySQL, and where's the ceiling?",
"<p>InnoDB FULLTEXT indexes support natural-language and boolean modes:</p>"+
"<pre><code>ALTER TABLE products ADD FULLTEXT idx_ft (name, description);\nSELECT id, name,\n       MATCH(name, description) AGAINST('+wireless +charger -car' IN BOOLEAN MODE) AS score\nFROM products\nWHERE MATCH(name, description) AGAINST('+wireless +charger -car' IN BOOLEAN MODE)\nORDER BY score DESC LIMIT 20;</code></pre>"+
"<ul><li>Good enough for: admin search, small catalogs, exact-ish term matching.</li><li>Ceilings: no real typo tolerance, weak relevance tuning, minimum token length quirks, no faceting — and FT index maintenance costs on hot write tables.</li></ul>"+
"<p>When the product team asks for &ldquo;search like Amazon&rdquo; (typos, synonyms, facets, ranking), move search to a dedicated engine (OpenSearch, Meilisearch, Typesense) fed by CDC/outbox events, and keep MySQL as the source of truth.</p>"),
q("MY","How do you run schema changes on a large, hot MySQL table without downtime?",
"<ol><li><strong>Try native online DDL first</strong>: <code>ALTER TABLE ... ALGORITHM=INSTANT</code> (8.0: add column, rename) is metadata-only; <code>INPLACE, LOCK=NONE</code> allows concurrent DML for many operations. MySQL errors out if the combo isn't supported — so you fail fast, not lock.</li><li><strong>Otherwise use a ghost tool</strong> — <code>gh-ost</code> or <code>pt-online-schema-change</code>: create shadow table, backfill in throttled chunks, mirror ongoing changes (binlog for gh-ost), then atomic rename cut-over.</li><li><strong>Always</strong>: run on a replica clone first, watch replication lag during backfill, and schedule cut-over off-peak with a rollback plan (keep the old table for a day).</li></ol>"+
"<div class='callout'><b>Real world</b>Adding an index to a 900M-row events table: native INPLACE was supported but saturated replica apply; gh-ost with <code>--max-lag-millis=1500</code> throttling took 11 hours and nobody noticed. Boring is the goal.</div>"),
q("MY","Why does connection pooling matter so much with MySQL, and where do you pool?",
"<p>Each MySQL connection is a server thread with per-connection buffers; thousands of connections mean scheduler thrash and memory pressure, and connection <em>establishment</em> (TCP + auth) is expensive at request rates.</p>"+
"<ul><li><strong>App-side pooling</strong> (ADO.NET pools per connection string by default) — first line; size it: pool_max &asymp; (cores &times; small factor), not 500.</li><li><strong>Middle tier — ProxySQL</strong>: multiplexes many app connections onto few backend ones, adds read/write splitting, query routing, and fast failover — essential when you have dozens of service instances each with their own pool.</li><li>Serverless/lambda callers need the middle tier even more: cold instances stampeding connections can DoS your own database.</li></ul>"+
"<pre><code>// .NET connection string essentials\n\"Server=proxysql;Database=shop;MaximumPoolSize=40;MinimumPoolSize=5;ConnectionLifeTime=300\"</code></pre>"),
q("MY","utf8 vs utf8mb4 in MySQL — why is this a real production issue?",
"<p>MySQL's legacy <code>utf8</code> is a 3-byte-max alias (<code>utf8mb3</code>) — it cannot store emoji, many CJK extension characters, or any code point above the BMP. Inserting them yields errors or silent truncation depending on strict mode.</p>"+
"<pre><code>ALTER TABLE reviews CONVERT TO CHARACTER SET utf8mb4\n  COLLATE utf8mb4_0900_ai_ci;   -- 8.0 default, correct sorting</code></pre>"+
"<ul><li>Set it everywhere: server default, database, table, <em>and</em> the client connection charset — a mismatch corrupts at the boundary.</li><li>Index length: utf8mb4 chars can take 4 bytes; old 767-byte index limits capped VARCHAR(255) keys — modern <code>innodb_large_prefix</code>/8.0 defaults lift this to 3072 bytes.</li><li>Choose collation deliberately: <code>_0900_ai_ci</code> (accent/case-insensitive) for search-ish fields; <code>_bin</code> for tokens/codes.</li></ul>"+
"<div class='callout'><b>Real world</b>Customer reviews API &ldquo;randomly&rdquo; failed for mobile users — every failure contained an emoji. One migration later, zero occurrences.</div>");

/* ============ POSTGRESQL ============ */
q("PG","Explain MVCC in PostgreSQL and why VACUUM is not optional.",
"<p>Postgres never updates a row in place: an UPDATE writes a new row version and marks the old one dead (xmin/xmax transaction IDs decide visibility per snapshot). Readers never block writers — but dead versions accumulate as <strong>bloat</strong>.</p>"+
"<ul><li><strong>VACUUM</strong> reclaims dead tuples for reuse; <strong>autovacuum</strong> must keep pace with your update rate or tables/indexes swell and scans slow.</li><li><strong>Transaction ID wraparound</strong>: XIDs are 32-bit; without freezing old tuples, the cluster eventually forces an emergency shutdown-level vacuum. Monitor <code>age(relfrozenxid)</code>.</li><li>Long-running transactions (or abandoned <code>idle in transaction</code> sessions) pin the oldest visible snapshot and block cleanup cluster-wide.</li></ul>"+
"<div class='callout'><b>Real world</b>A queue-like table updated millions of times daily bloated to 30&times; its live size because default autovacuum thresholds (20% of a huge table) fired too rarely. Per-table tuning fixed it: <code>ALTER TABLE jobs SET (autovacuum_vacuum_scale_factor=0.01, autovacuum_vacuum_cost_limit=2000);</code></div>"),
q("PG","B-tree, GIN, GiST, BRIN — match each index type to a real workload.",
"<ul><li><strong>B-tree</strong> (default): equality and range on scalar columns; supports ORDER BY. 95% of indexes.</li><li><strong>GIN</strong>: inverted index for &ldquo;contains&rdquo; queries — JSONB (<code>@&gt;</code>), arrays, full-text <code>tsvector</code>. Slower to update, brilliant to query.</li><li><strong>GiST</strong>: geometric/nearest-neighbour and exclusion constraints — PostGIS shapes, range types (<code>&amp;&amp;</code> overlap: &ldquo;no double bookings&rdquo;).</li><li><strong>BRIN</strong>: tiny min/max summaries per block range — huge append-only tables queried by time. A BRIN on a 2 TB events table can be a few MB where a B-tree would be 100+ GB.</li></ul>"+
"<pre><code>CREATE INDEX idx_docs_meta  ON docs  USING GIN (metadata jsonb_path_ops);\nCREATE INDEX idx_evt_time   ON events USING BRIN (created_at);\nALTER TABLE bookings ADD CONSTRAINT no_overlap\n  EXCLUDE USING GIST (room_id WITH =, during WITH &amp;&amp;);</code></pre>"),
q("PG","When is JSONB the right call in a relational schema, and how do you keep it queryable?",
"<p>JSONB fits genuinely schema-flexible data: per-tenant custom fields, third-party webhook payloads, product attributes that vary by category. It is the wrong call for data you filter, join, aggregate and constrain constantly — that's a column.</p>"+
"<pre><code>-- Containment query served by GIN:\nSELECT id FROM products\nWHERE attributes @&gt; '{\"connectivity\":\"bluetooth\"}';\n\n-- Hot key promoted to a real (generated) column:\nALTER TABLE products ADD COLUMN brand text\n  GENERATED ALWAYS AS (attributes-&gt;&gt;'brand') STORED;\nCREATE INDEX ON products(brand);</code></pre>"+
"<ul><li>Index with GIN (<code>jsonb_path_ops</code> is smaller/faster for pure containment).</li><li>Promote hot keys to generated columns for stats, joins, and FKs.</li><li>Remember: updating one key rewrites the whole JSONB value (MVCC) — high-churn counters don't belong inside a document.</li></ul>"),
q("PG","How does declarative partitioning work, and what did it buy you in production?",
"<pre><code>CREATE TABLE events (\n  id bigint GENERATED ALWAYS AS IDENTITY,\n  created_at timestamptz NOT NULL,\n  payload jsonb,\n  PRIMARY KEY (id, created_at)\n) PARTITION BY RANGE (created_at);\n\nCREATE TABLE events_2026_07 PARTITION OF events\n  FOR VALUES FROM ('2026-07-01') TO ('2026-08-01');</code></pre>"+
"<ul><li><strong>Pruning</strong>: time-filtered queries touch only matching partitions — planner skips the rest.</li><li><strong>Retention</strong>: <code>DROP TABLE events_2025_06</code> is instant vs a week of DELETE + vacuum.</li><li><strong>Maintenance locality</strong>: autovacuum and indexes work on month-sized chunks; old partitions stay quiescent.</li><li>Costs: the partition key must be in every unique constraint; too many partitions (&gt;few thousand) inflate planning time; automate creation (pg_partman) or the midnight-of-the-new-month incident finds you.</li></ul>"),
q("PG","LISTEN/NOTIFY vs logical replication vs CDC — how do you push changes out of Postgres?",
"<ul><li><strong>LISTEN/NOTIFY</strong>: lightweight in-database pub/sub. Fire <code>NOTIFY</code> in a trigger/transaction; connected apps get pinged. Great for cache invalidation and &ldquo;wake the worker&rdquo;. Caveats: no persistence (miss it if disconnected), 8 KB payloads, doesn't cross servers.</li><li><strong>Logical replication</strong>: publish/subscribe row changes between Postgres instances — selective table replication, near-zero-downtime major upgrades, feeding a reporting instance.</li><li><strong>CDC via logical decoding (Debezium + wal2json/pgoutput)</strong>: stream every committed change into Kafka — the backbone for syncing search indexes, caches and downstream services without dual writes.</li></ul>"+
"<div class='callout'><b>Real world</b>We used NOTIFY to wake job workers instantly (killing the 5-second poll loop), and Debezium CDC to keep OpenSearch in sync with the catalog — the app wrote to Postgres only, and search followed within ~1 s.</div>"),
q("PG","What changed about CTE optimisation in PostgreSQL 12, and why does it matter?",
"<p>Before PG 12, every CTE was an <strong>optimisation fence</strong>: materialised fully, no predicate pushdown. Developers wrote CTEs for readability and unknowingly forced Postgres to compute an entire intermediate set before filtering.</p>"+
"<pre><code>WITH recent AS (\n  SELECT * FROM orders WHERE created_at &gt; now() - interval '30 days'\n)\nSELECT * FROM recent WHERE customer_id = 42;\n-- PG 11: scans 30 days of ALL customers, then filters\n-- PG 12+: inlines → index seek on (customer_id, created_at)</code></pre>"+
"<ul><li>PG 12+ inlines CTEs referenced once with no side effects; you can force behaviour: <code>WITH x AS MATERIALIZED (...)</code> to keep the fence (sometimes you <em>want</em> it, e.g., to stabilise a plan or compute once, use twice), or <code>NOT MATERIALIZED</code> to insist on inlining.</li><li>Interview takeaway: know your version's planner semantics; a &ldquo;readability refactor&rdquo; into CTEs can change performance in either direction.</li></ul>"),
q("PG","Implement multi-tenant isolation with Row-Level Security. What are the operational gotchas?",
"<pre><code>ALTER TABLE invoices ENABLE ROW LEVEL SECURITY;\nCREATE POLICY tenant_isolation ON invoices\n  USING (tenant_id = current_setting('app.tenant_id')::uuid);\n\n-- Per request, inside the transaction:\nSET LOCAL app.tenant_id = '7c9e...';</code></pre>"+
"<p>Every query is now transparently filtered — a forgotten <code>WHERE tenant_id=</code> in application code can no longer leak tenant data. Gotchas:</p>"+
"<ul><li><strong>Superusers and table owners bypass RLS</strong> unless you <code>FORCE ROW LEVEL SECURITY</code>; the app must connect as a non-owner role.</li><li>Connection pooling: use <code>SET LOCAL</code> (transaction-scoped) so a pooled connection can't carry tenant A's setting into tenant B's request.</li><li>Plans include the policy predicate — index <code>tenant_id</code> first in composite indexes.</li><li>RLS is defence-in-depth, not a substitute for app-level authorisation on actions.</li></ul>"),
q("PG","How does the Postgres extension ecosystem change architecture decisions? Give concrete examples.",
"<p>Extensions let Postgres absorb workloads that would otherwise mean another database to operate:</p>"+
"<ul><li><strong>pgvector</strong>: embedding storage + ANN search (<code>ivfflat</code>/<code>hnsw</code>) — a RAG pipeline can keep documents, metadata filters, and vectors in one transactional store instead of bolting on a vector DB at small/medium scale.</li><li><strong>PostGIS</strong>: industrial-grade geospatial — &ldquo;stores within 5 km&rdquo; with a GiST index.</li><li><strong>pg_trgm</strong>: trigram similarity for fuzzy search and fast <code>ILIKE '%term%'</code>.</li><li><strong>pg_partman / pg_cron</strong>: partition automation and in-DB scheduling.</li></ul>"+
"<pre><code>CREATE EXTENSION vector;\nCREATE INDEX ON docs USING hnsw (embedding vector_cosine_ops);\nSELECT id FROM docs ORDER BY embedding &lt;=&gt; :query_vec LIMIT 5;</code></pre>"+
"<p>The architectural principle: fewer moving systems beats theoretically-optimal specialised stores until scale forces the split — and Postgres pushes that threshold surprisingly far.</p>"),
q("PG","Why is PgBouncer near-mandatory for Postgres at scale, and which pooling mode do you run?",
"<p>Postgres uses a <strong>process per connection</strong> — each one costs real memory and fork/teardown work. A fleet of app instances with default pools of 100 each will flatten the server long before query load does.</p>"+
"<ul><li><strong>Session pooling</strong>: one server connection per client for its lifetime — safe, minimal gain.</li><li><strong>Transaction pooling</strong> (the production standard): a server connection is borrowed per transaction — hundreds of app connections share tens of backends. Restriction: no session state across transactions (no session-level <code>SET</code>, prepared statements need care — PgBouncer 1.21+ supports protocol-level prepared statements).</li></ul>"+
"<pre><code># pgbouncer.ini\npool_mode = transaction\ndefault_pool_size = 20\nmax_client_conn = 2000</code></pre>"+
"<div class='callout'><b>Real world</b>Kubernetes scale-out event: 60 pods &times; 50-connection pools = 3000 connections into a db.r6g with <code>max_connections=500</code>. PgBouncer in transaction mode absorbed it with 40 backends and the incident class disappeared.</div>"),
q("PG","Walk through diagnosing a slow query with EXPLAIN (ANALYZE, BUFFERS).",
"<pre><code>EXPLAIN (ANALYZE, BUFFERS)\nSELECT o.id, o.total FROM orders o\nWHERE o.customer_id = 42 AND o.status = 'open'\nORDER BY o.created_at DESC LIMIT 20;</code></pre>"+
"<ol><li><strong>Actual vs estimated rows</strong> per node — big skews mean stale stats (<code>ANALYZE</code>), correlated columns (<code>CREATE STATISTICS</code>), or a data-model surprise.</li><li><strong>Buffers</strong>: <code>shared hit</code> (cache) vs <code>read</code> (disk). A &ldquo;fast&rdquo; query doing 200k reads is a cold-cache time bomb.</li><li><strong>Node types</strong>: Seq Scan under a selective filter &rarr; missing index; Sort spilling (&ldquo;external merge Disk&rdquo;) &rarr; raise <code>work_mem</code> for the query or index the sort; Nested Loop over thousands of outer rows against a Seq Scan inner &rarr; catastrophic misestimate.</li><li>Fix, re-run, compare buffers — buffer counts are more stable evidence than wall-clock on a busy box.</li></ol>"+
"<p>Fleet-level: <code>pg_stat_statements</code> ranks queries by total time — optimise the top of that list, not the query someone happened to complain about.</p>");

/* ============ AWS ============ */
q("AWS","EC2 vs ECS/Fargate vs EKS vs Lambda — give your decision framework with real trade-offs.",
"<ul><li><strong>Lambda</strong>: event-driven, spiky or low duty-cycle work, &le;15 min executions. You buy zero idle cost and pay with cold starts, package limits and per-invocation model.</li><li><strong>ECS Fargate</strong>: containers without cluster management — the default for most .NET APIs. Less knobs than EKS, dramatically less operational load.</li><li><strong>EKS</strong>: choose Kubernetes only when you need its ecosystem (operators, service mesh, multi-cloud portability) <em>and</em> have people to run it. It's a platform-team commitment, not a deployment choice.</li><li><strong>EC2</strong>: special cases — GPU fleets, licensed software, extreme cost tuning with reserved capacity, or software that assumes a VM.</li></ul>"+
"<div class='callout'><b>Real world</b>Our split: APIs on ECS Fargate, webhook/event glue on Lambda, one EKS cluster only because a vendor's product shipped as Helm charts. Start with the simplest compute that fits; migrating up is easier than running Kubernetes you didn't need.</div>"),
q("AWS","S3 deep-dive: consistency, storage classes, and presigned URLs in a real upload flow.",
"<ul><li><strong>Consistency</strong>: S3 is now strongly consistent for reads-after-writes (since Dec 2020) — list-after-put returns the object. Design decisions from the eventual-consistency era can be deleted.</li><li><strong>Storage classes</strong>: Standard &rarr; Intelligent-Tiering (unknown access patterns — usually the right default) &rarr; Standard-IA &rarr; Glacier tiers. Use lifecycle rules; also expire incomplete multipart uploads — an invisible cost classic.</li><li><strong>Presigned URLs</strong>: the API authorises and signs, the client transfers directly with S3 — your servers never proxy gigabytes.</li></ul>"+
"<pre><code>// .NET: presigned PUT valid 10 minutes\nvar url = s3.GetPreSignedURL(new GetPreSignedUrlRequest {\n    BucketName = \"user-uploads\", Key = $\"docs/{id}.pdf\",\n    Verb = HttpVerb.PUT, Expires = DateTime.UtcNow.AddMinutes(10),\n    ContentType = \"application/pdf\"\n});</code></pre>"+
"<p>Complete the flow with an S3 event notification &rarr; queue &rarr; virus-scan/processing worker, and block public access at the account level.</p>"),
q("AWS","SQS vs SNS vs EventBridge — how do they compose in an event-driven order system?",
"<ul><li><strong>SQS</strong>: a queue one consumer group drains — work distribution, buffering, retries + DLQ. FIFO variant for ordering/exactly-once-ish semantics.</li><li><strong>SNS</strong>: fan-out pub/sub — one event, many subscribers, each usually backed by its own SQS queue so they absorb bursts independently.</li><li><strong>EventBridge</strong>: an event bus with content-based routing rules, schema registry, SaaS/AWS-service events, archive &amp; replay — the choice for cross-domain integration; SNS+SQS for high-throughput internal fan-out.</li></ul>"+
"<p>Non-negotiables: every queue gets a DLQ with an alarm; consumers are idempotent (at-least-once delivery means duplicates <em>will</em> arrive).</p>",
"sequenceDiagram\nautonumber\nparticipant API as Orders API\nparticipant SNS as SNS Topic (order-placed)\nparticipant Q1 as SQS email-queue\nparticipant Q2 as SQS inventory-queue\nparticipant W1 as Email Service\nparticipant W2 as Inventory Service\nparticipant DLQ as DLQ + Alarm\nAPI->>SNS: Publish OrderPlaced {orderId 881}\nSNS-->>Q1: Fan-out copy\nSNS-->>Q2: Fan-out copy\nW1->>Q1: Poll (long polling)\nQ1-->>W1: OrderPlaced\nW1->>W1: Send confirmation (idempotency key = orderId)\nW2->>Q2: Poll\nQ2-->>W2: OrderPlaced\nW2--xW2: Handler throws (bug)\nNote over Q2,W2: Retry x3 via visibility timeout\nQ2-->>DLQ: Move after maxReceiveCount\nDLQ->>DLQ: CloudWatch alarm pages on-call"),
q("AWS","RDS vs Aurora, and Multi-AZ vs read replicas — untangle the availability vs scalability confusion.",
"<p>Two orthogonal axes people mix up:</p>"+
"<ul><li><strong>Multi-AZ = availability</strong>: a synchronously replicated standby you can't query (classic Multi-AZ); failover in ~60–120 s. It does nothing for read throughput.</li><li><strong>Read replicas = scalability</strong>: async copies you route reads to; they carry replication lag and are not an HA mechanism by themselves.</li></ul>"+
"<p><strong>Aurora</strong> changes the model: storage is a distributed, 6-way replicated layer across 3 AZs; replicas read the shared storage, so lag is ~10–20 ms and failover promotes a replica in ~30 s. Aurora adds a reader endpoint with load balancing, fast cloning for staging refreshes, and Serverless v2 for spiky workloads.</p>"+
"<div class='callout'><b>Real world</b>Choose standard RDS for steady, modest workloads (cheaper); Aurora when you need many low-lag readers, fast failover, or clone-based environments. Either way: test failover on purpose — the first failover you experience should not be a real incident.</div>"),
q("AWS","IAM roles vs users vs policies — how do you design least-privilege for a workload?",
"<ul><li><strong>No long-lived access keys for workloads.</strong> Services assume <strong>roles</strong>: ECS task roles, EC2 instance profiles, Lambda execution roles, and OIDC federation for GitHub Actions — all yield short-lived STS credentials automatically.</li><li><strong>Users</strong> are for humans, and even then prefer Identity Center (SSO) with permission sets over IAM users.</li><li>Least privilege in practice: scope actions <em>and</em> resources — <code>s3:GetObject</code> on <code>arn:aws:s3:::invoices-prod/tenant-*/*</code>, not <code>s3:*</code> on <code>*</code>. Use conditions (VPC endpoint, tags) for the sensitive stuff.</li></ul>"+
"<pre><code>{ \"Effect\": \"Allow\",\n  \"Action\": [\"sqs:ReceiveMessage\",\"sqs:DeleteMessage\"],\n  \"Resource\": \"arn:aws:sqs:eu-west-2:1234:orders-*\" }</code></pre>"+
"<p>Guardrails above the policies: SCPs to deny whole capabilities org-wide (leave regions, disable CloudTrail), Access Analyzer to catch unintended external access, and IAM Access Advisor to prune unused permissions quarterly.</p>"),
q("AWS","Design a production VPC. Subnets, NAT, security groups vs NACLs — what goes where?",
"<ul><li><strong>Tiers</strong>: public subnets hold only entry points (ALB, NAT gateways); private subnets hold compute; isolated subnets hold databases (no internet route at all). Repeat across &ge;2 AZs.</li><li><strong>NAT gateway per AZ</strong> for private-subnet egress — one shared NAT is a cross-AZ cost and a single-AZ dependency.</li><li><strong>Security groups</strong> (stateful, instance-level) are your real firewall — and they can reference each other: DB SG allows 5432 <em>from the app SG</em>, not from a CIDR. NACLs (stateless, subnet-level) stay default except for coarse deny rules.</li><li><strong>VPC endpoints</strong> (S3/DynamoDB gateway endpoints are free) keep AWS traffic off the NAT — both a security win and often a large NAT-processing cost saving.</li></ul>"+
"<div class='callout'><b>Real world</b>A data pipeline pushing TBs to S3 through NAT gateways generated a five-figure monthly NAT bill; one gateway endpoint reduced it to zero.</div>"),
q("AWS","Lambda cold starts with .NET — causes, numbers, and the mitigation ladder.",
"<p>A cold start = provision sandbox + load runtime + JIT your assemblies + run static init. .NET historically sat at the heavier end (hundreds of ms to seconds for large deps like EF Core).</p>"+
"<p>Mitigation ladder, cheapest first:</p>"+
"<ol><li><strong>Trim the package</strong>: fewer assemblies, lazy-init heavy clients, avoid EF Core in latency-critical functions (Dapper or the native DynamoDB SDK).</li><li><strong>ReadyToRun / Native AOT</strong>: AOT (.NET 8+) cuts cold starts dramatically (often to ~100–300 ms) at the price of trimming/reflection constraints — source-generated JSON serialisation becomes mandatory.</li><li><strong>SnapStart for .NET</strong> (2024+): resume from a snapshot instead of full init.</li><li><strong>Provisioned concurrency</strong>: pay to keep N warm — reserve for genuinely latency-critical, spiky endpoints.</li></ol>"+
"<p>Also remember: cold starts hit a small % of invocations; measure P99 before spending. Steady-traffic APIs may be better on Fargate anyway.</p>"),
q("AWS","DynamoDB single-table design — when does it shine and when is it the wrong religion?",
"<p>DynamoDB gives predictable single-digit-ms performance <em>if</em> you model around access patterns. Single-table design overloads one table with generic <code>PK</code>/<code>SK</code> so related items are fetched in one query:</p>"+
"<pre><code>PK              SK                 Data\nCUST#42         PROFILE            {name, tier}\nCUST#42         ORDER#2026-07-01#881   {total: 129.00}\nCUST#42         ORDER#2026-06-14#774   {total: 40.00}\n-- \"customer + recent orders\" = one Query on PK, SK begins_with ORDER#</code></pre>"+
"<ul><li>Shines: known, stable access patterns; high scale; serverless stacks; item collections fetched together.</li><li>Wrong fit: ad-hoc queries, heavy aggregations, evolving analytics needs — you'll end up streaming to something queryable anyway. GSIs cover extra patterns but each one duplicates write cost.</li><li>Watch hot partitions (a celebrity tenant on one PK) and the 400 KB item limit.</li></ul>"+
"<p>Honest guidance: if the team is fluent in relational modelling and scale is moderate, Aurora/Postgres is often the faster path to a correct system.</p>"),
q("AWS","How do you use CloudFront beyond static assets — API caching, security, and cost effects.",
"<ul><li><strong>Static + SPA</strong>: S3 origin (locked with Origin Access Control), long-cache hashed assets, short-cache <code>index.html</code>.</li><li><strong>API acceleration</strong>: even for uncacheable APIs, CloudFront terminates TLS at the edge and rides the AWS backbone to origin — lower latency for global users. For cacheable GETs (catalogs, configs), a 30–60 s TTL with <code>stale-while-revalidate</code> absorbs traffic spikes gracefully.</li><li><strong>Security edge</strong>: attach WAF (rate rules, managed rule sets), use signed URLs/cookies for private content, and add security headers via response header policies.</li><li><strong>Cost</strong>: CloudFront egress is cheaper than S3/EC2 egress, and cache hits don't touch origin at all — a high hit ratio is a direct bill reduction.</li></ul>"+
"<div class='callout'><b>Real world</b>Putting a 60-second edge cache on a public pricing endpoint took origin traffic down 97% during a TV-ad spike — no autoscaling drama, no code change.</div>"),
q("AWS","Your AWS bill doubled quarter-over-quarter. Walk through your response using Well-Architected thinking.",
"<ol><li><strong>See it</strong>: Cost Explorer grouped by service and by <code>cost-allocation tags</code> (team/env/service). Untagged spend gets a tagging enforcement policy — you can't manage what you can't attribute.</li><li><strong>Kill waste</strong>: idle/oversized instances (Compute Optimizer), unattached EBS, old snapshots, incomplete multipart uploads, dev environments running weekends (scheduler), gp2&rarr;gp3, NAT traffic that belongs on VPC endpoints.</li><li><strong>Buy correctly</strong>: Savings Plans/RIs for the proven steady base (start ~60–70% coverage), Spot for stateless/batch, Graviton where images allow (~20% better price-perf).</li><li><strong>Design changes</strong>: caching in front of hot endpoints, S3 lifecycle policies, right-sizing RDS after read-replica offload — architecture is the biggest lever, purchasing is second.</li><li><strong>Keep it fixed</strong>: budgets + anomaly detection alerts, a monthly cost review with the same seriousness as an ops review.</li></ol>"+
"<p>Frame it in the interview: cost is the sixth pillar for a reason — treat cost regressions like performance regressions, with owners and alarms.</p>");

/* ============ DESIGN PATTERNS ============ */
q("DP","Strategy pattern — show a real payment-provider implementation in .NET with DI.",
"<p>Strategy extracts interchangeable algorithms behind one interface so the calling code never branches on type. The classic production case: multiple payment providers.</p>"+
"<pre><code>public interface IPaymentProvider {\n    string Key { get; }                       // \"stripe\", \"paypal\", \"klarna\"\n    Task&lt;PaymentResult&gt; ChargeAsync(PaymentRequest req, CancellationToken ct);\n}\n\n// Registration + resolution by key (no switch statements anywhere)\nservices.AddScoped&lt;IPaymentProvider, StripeProvider&gt;();\nservices.AddScoped&lt;IPaymentProvider, PayPalProvider&gt;();\nservices.AddScoped&lt;PaymentRouter&gt;();\n\npublic sealed class PaymentRouter(IEnumerable&lt;IPaymentProvider&gt; providers) {\n    private readonly Dictionary&lt;string, IPaymentProvider&gt; _map =\n        providers.ToDictionary(p =&gt; p.Key);\n    public IPaymentProvider For(string key) =&gt;\n        _map.TryGetValue(key, out var p) ? p : throw new UnknownProviderException(key);\n}</code></pre>"+
"<p>Adding Klarna is a new class + one registration — zero edits to checkout code (this is OCP delivered by Strategy). Each provider is unit-tested in isolation with its own HTTP mock.</p>"),
q("DP","Factory Method vs Abstract Factory — and what does DI change about when you need them?",
"<ul><li><strong>Factory Method</strong>: one product, creation deferred/encapsulated — e.g., <code>NotificationFactory.Create(channel)</code> returning SMS/email/push senders based on runtime data.</li><li><strong>Abstract Factory</strong>: a <em>family</em> of related products that must be consistent — e.g., a document-export suite where PDF vs Excel each need a matching writer, styler and paginator; the factory guarantees you never mix PDF writer with Excel styler.</li></ul>"+
"<pre><code>// DI-era pragmatic factory: runtime choice over container-registered options\nservices.AddKeyedScoped&lt;IExporter, PdfExporter&gt;(\"pdf\");\nservices.AddKeyedScoped&lt;IExporter, XlsxExporter&gt;(\"xlsx\");\npublic sealed class ExportService([FromKeyedServices] IServiceProvider sp) {\n    public IExporter For(string fmt) =&gt; sp.GetRequiredKeyedService&lt;IExporter&gt;(fmt);\n}</code></pre>"+
"<p>DI containers <em>are</em> factories for compile-time-known graphs; hand-written factories remain for decisions made on runtime data (message type, tenant plan, file format). If a factory just calls <code>new</code> with no logic, delete it.</p>"),
q("DP","Decorator pattern — where does ASP.NET Core use it, and how would you add one yourself?",
"<p>Decorator wraps an implementation with the same interface, adding behaviour around the call. <code>HttpClient</code>'s <code>DelegatingHandler</code> chain is decorator in the wild: each handler wraps the next (auth &rarr; retry &rarr; logging &rarr; transport).</p>"+
"<pre><code>// Caching decorator around a repository, wired manually:\npublic sealed class CachedCatalogRepo(ICatalogRepo inner, HybridCache cache) : ICatalogRepo {\n    public async Task&lt;Product?&gt; GetAsync(int id, CancellationToken ct) =&gt;\n        await cache.GetOrCreateAsync($\"product:{id}\",\n            async token =&gt; await inner.GetAsync(id, token),\n            cancellationToken: ct);\n}\n\nservices.AddScoped&lt;CatalogRepo&gt;();\nservices.AddScoped&lt;ICatalogRepo&gt;(sp =&gt; new CachedCatalogRepo(\n    sp.GetRequiredService&lt;CatalogRepo&gt;(),\n    sp.GetRequiredService&lt;HybridCache&gt;()));</code></pre>"+
"<p>Why decorator over editing the class: caching, metrics, and authorisation stay composable and individually testable, and the inner repo remains pure data access. (Scrutor's <code>.Decorate&lt;&gt;()</code> removes the wiring boilerplate.)</p>"),
q("DP","Mediator pattern and MediatR — what does it buy, and what's the honest criticism?",
"<p>Mediator centralises communication: controllers send commands/queries to a mediator that routes to one handler, instead of injecting six services. With MediatR you also get <strong>pipeline behaviours</strong> — validation, logging, transactions wrap every handler uniformly:</p>"+
"<pre><code>public sealed class ValidationBehavior&lt;TReq,TRes&gt;(IEnumerable&lt;IValidator&lt;TReq&gt;&gt; validators)\n    : IPipelineBehavior&lt;TReq,TRes&gt; {\n    public async Task&lt;TRes&gt; Handle(TReq req, RequestHandlerDelegate&lt;TRes&gt; next, CancellationToken ct) {\n        var failures = validators.Select(v =&gt; v.Validate(req))\n                                 .SelectMany(r =&gt; r.Errors).ToList();\n        if (failures.Count &gt; 0) throw new ValidationException(failures);\n        return await next();\n    }\n}</code></pre>"+
"<p>Honest criticism: it adds indirection (&ldquo;go to definition&rdquo; lands on an interface), hides the call graph from the compiler, and teams cargo-cult it into 5-line CRUD apps where it's pure ceremony. My line: it earns its keep when you have real cross-cutting pipeline behaviours and CQRS-shaped handlers; a small service is fine calling application services directly.</p>"),
q("DP","Repository + Unit of Work over EF Core — pattern or anti-pattern? Defend a position.",
"<p>Position: <strong>a generic <code>IRepository&lt;T&gt;</code> over EF Core is usually an anti-pattern; purposeful, aggregate-oriented repositories are not.</strong></p>"+
"<ul><li><code>DbContext</code> already <em>is</em> Unit of Work and <code>DbSet</code> already is a repository. A generic wrapper re-exposes <code>IQueryable</code> (abstraction leak — callers still write EF-specific queries) or hides it (and you reinvent a query language badly).</li><li>What earns its place: an interface named after <em>domain intent</em>, returning aggregates, hiding query mechanics:</li></ul>"+
"<pre><code>public interface IOrderRepository {\n    Task&lt;Order?&gt; GetWithLinesAsync(OrderId id, CancellationToken ct);\n    Task&lt;IReadOnlyList&lt;Order&gt;&gt; DueForSettlementAsync(DateOnly day, CancellationToken ct);\n    void Add(Order order);\n}</code></pre>"+
"<p>This gives testability at the domain boundary and keeps EF details in one project — without pretending you might &ldquo;swap the ORM&rdquo; someday. Read-side queries can bypass it entirely with projections (CQRS-lite).</p>"),
q("DP","Singleton — why is the classic implementation a liability, and what replaced it?",
"<p>The GoF static-instance singleton hard-couples consumers to a concrete type, hides the dependency (nothing in a constructor signature says it's used), makes tests order-dependent through shared state, and complicates lifetime in async/multi-tenant contexts.</p>"+
"<pre><code>// Modern equivalent: singleton LIFETIME, not singleton PATTERN\nservices.AddSingleton&lt;ITokenSigner, RsaTokenSigner&gt;();\n// Consumers declare it, tests substitute it:\npublic sealed class AuthService(ITokenSigner signer) { ... }</code></pre>"+
"<ul><li>The container guarantees one instance; the type stays a normal, testable class.</li><li>Singleton-lifetime rules: thread-safe, no mutable request state, never capture scoped services (captive dependency).</li><li>Legit remaining uses of static: pure constants and <code>Lazy&lt;T&gt;</code> for expensive process-wide immutables — with the same &ldquo;no hidden mutable state&rdquo; discipline.</li></ul>"),
q("DP","Adapter pattern — describe an integration where it saved the codebase.",
"<p>Adapter converts an interface you're stuck with into the interface your domain wants — the standard weapon for legacy and third-party integrations.</p>"+
